<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ACBreakz Overlay</title>
<!--
  ACBreakz Cloud Overlay v2 — one URL, five independent PCs.
  OBS Browser Source: width 1080, height 1920, FPS 60.
  Layers (3 separate browser sources, same URL, different ?layer=):
    ?layer=bg   -> streamer background   ?layer=hud -> board + banners
    ?layer=fx   -> animations + sfx      ?layer=all -> testing in a browser
  ?pc=1..6 selects WHICH stream this is (6 = PC Test) (each PC has its own board/banners/
  background/styles; the asset library is shared). &debug=1 draws guides.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --navy-deep:#071527; --navy:#0B1E33; --steel:#274A66;
    --teal-glass:#0D3540; --teal-dim:#082228;
    --copper:#B87333; --copper-dk:#7A4A1E; --gold:#D9A441;
    --bone:#EFE9DC; --volt:#35A7FF; --danger:#E5484D;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:"Arial Black","Segoe UI",system-ui,sans-serif}
  .abs{position:absolute}

  /* ---------- BG LAYER (streamer background, 1080x480) ---------- */
  #layer-bg{inset:0;display:none}
  #bgFrame{left:0;top:0;width:1080px;height:480px;overflow:hidden;background:
    radial-gradient(120% 160% at 50% -20%, #123a5c 0%, var(--navy) 45%, var(--navy-deep) 100%)}
  #bgFrame video,#bgFrame img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
  /* The seam between the background and the board. A 2-stop linear ramp darkens at a
     CONSTANT rate, which the eye reads as a hard line where it starts (Mach banding) —
     it looked like a bar laid over the art rather than a shadow. This is an ease-in
     (alpha tracks t^2.2), so the top ~a third is imperceptible and the darkening only
     really arrives at the board edge, where it anchors the board. Shorter too: 44px of
     the 480px band instead of 70px, so the background keeps another 26px of itself. */
  #bgFrame .fade{position:absolute;left:0;right:0;bottom:0;height:36px;
    background:linear-gradient(180deg,
      rgba(4,10,18,0)     0%,
      rgba(4,10,18,.03)  12%,
      rgba(4,10,18,.13)  25%,
      rgba(4,10,18,.28)  38%,
      rgba(4,10,18,.43)  50%,
      rgba(4,10,18,.58)  62%,
      rgba(4,10,18,.73)  75%,
      rgba(4,10,18,.83)  88%,
      rgba(4,10,18,.86) 100%)}

  /* ---------- HUD LAYER (board 1080x165 @y480, banners 1080x97 @y645) ---------- */
  #layer-hud{inset:0;display:none}
  /* Tiles live inside the WhatNot-safe area measured from the original board art:
     x 111..968 (858 wide), tiles 53x53 square, 16 x 2. Never wider than this. */
  #board{--gap:0px;--tile:53px;--track:53px;--cols:16;--rows:2;--fxi:1;--logofrac:.18;--padx:111px;
    --radius:calc(var(--tile) * .165);--bezel:calc(var(--tile) * .1);
    --logopad:calc(var(--tile) * var(--logofrac));
    left:0;top:480px;width:1080px;height:165px;overflow:hidden;
    background:
      radial-gradient(140% 220% at 50% -60%, rgba(53,167,255,.18), transparent 55%),
      linear-gradient(180deg,#0E2A38 0%, #0A1F2C 55%, #081824 100%);
    background-size:cover;background-position:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -14px 26px rgba(0,0,0,.55);
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--track));
    grid-template-rows:repeat(var(--rows), var(--track));
    justify-content:center;align-content:center;
    gap:var(--gap);padding:0 var(--padx)}
  /* one wide, feathered light bar sweeping BOTH rows at once (v2) */
  #board::after{content:"";position:absolute;top:-10px;bottom:-10px;left:0;width:430px;
    background:linear-gradient(100deg,
      transparent 0%, rgba(255,255,255,.015) 18%, rgba(255,255,255,.07) 38%,
      rgba(255,255,255,.13) 50%, rgba(255,255,255,.07) 62%, rgba(255,255,255,.015) 82%,
      transparent 100%);
    transform:skewX(-14deg);pointer-events:none;z-index:6;
    animation:sweep 9s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes sweep{
    0%{left:-470px;opacity:0} 6%{opacity:1}
    58%{left:1120px;opacity:1} 62%{left:1120px;opacity:0} 100%{left:-470px;opacity:0}}
  /* Beveled copper bezel + dark inset line + teal glass, matching the original art.
     Two background layers: glass clipped to the padding box, bezel to the border box. */
  /* v5: the cell itself carries NO art. "Gold Buttons" used to weld a copper bezel and a
     teal glass fill into one look with no way to keep one and drop the other — which is
     why the radial darkening could not be turned off. They are now two independent
     builtins: a BUTTON FRAME (.frame-gold) and a BUTTON STYLE (.btn-teal). */
  .cell{position:relative;width:var(--tile);height:var(--tile);
    border-radius:var(--radius);overflow:hidden;
    border:0 solid transparent;
    background-repeat:no-repeat;background-size:100% 100%;
    background-origin:padding-box;background-clip:padding-box;
    transition:filter .45s ease}
  /* builtin button STYLE: the teal glass fill */
  #board.btn-teal .cell{background-image:
    radial-gradient(120% 110% at 50% 32%, #14505A 0%, #0B3238 48%, #061C21 100%)}
  #board.btn-teal .cell::before{ /* faint glass gloss across the top edge */
    content:"";position:absolute;inset:0;
    background:linear-gradient(178deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 30%,transparent 52%);
    pointer-events:none;z-index:3}
  /* builtin button FRAME: the copper bezel, drawn on the border box */
  #board.frame-gold .cell{border-width:var(--bezel);
    background-image:
      linear-gradient(145deg, #E8C07A 0%, #C08A45 17%, #8A5A26 52%, #6B3F17 76%, #B27A3E 100%);
    background-origin:border-box;background-clip:border-box;
    box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.85), 0 2px 3px rgba(0,0,0,.55)}
  /* both at once = the original Gold Buttons look, as two stacked layers */
  #board.btn-teal.frame-gold .cell{
    background-image:
      radial-gradient(120% 110% at 50% 32%, #14505A 0%, #0B3238 48%, #061C21 100%),
      linear-gradient(145deg, #E8C07A 0%, #C08A45 17%, #8A5A26 52%, #6B3F17 76%, #B27A3E 100%);
    background-origin:padding-box, border-box;
    background-clip:padding-box, border-box;
    background-size:100% 100%, 100% 100%}
  .cell img.logo{position:absolute;inset:var(--logopad);
    width:calc(100% - 2*var(--logopad));height:calc(100% - 2*var(--logopad));
    object-fit:contain;z-index:2;
    /* a thin white rim lifts the logo off whatever texture is behind it; the dark drop
       shadow underneath still gives it weight. Both scale with the tile (set in JS)
       because --tile reads "auto" on the stretched grids. */
    /* A TIGHT rim, not a halo. Two stacked shadows at 1.6px and 3.2px on a ~37px logo
       read as blur, not separation — measured at 6x against the pre-glow build, that is
       what made the logos look grainy. One sub-pixel rim is enough to lift the logo off
       the texture without softening its edges. */
    filter:drop-shadow(0 0 var(--logoglow,.8px) rgba(255,255,255,.85))
           drop-shadow(0 2px 3px rgba(0,0,0,.7));
    transition:filter .45s ease, opacity .45s ease}

  /* v5: the button TEXTURE and the button FRAME are real elements, not background-image.
     background-size:100% 100% STRETCHES the art to the cell box, which warped every
     non-square grid (rect84 especially) and any non-square source. object-fit:cover
     scales uniformly and crops instead — the same thing applyCrop() already does for
     backgrounds and FX, so Reframe zoom/pan works here with no extra code.
     The frame sits ABOVE the texture and BELOW the logo: its middle is transparent, so
     the texture reads as the button background and the logo shows through. */
  .cell img.tex{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:50% 50%;pointer-events:none;z-index:0}
  /* The FRAME cannot use object-fit:cover. Cover-cropping a square frame into a wide
     cell (rect84) throws away the top and bottom rails and leaves only the sides — a
     border that is not a border. 9-slice is the technique that actually holds: the four
     corners are placed unscaled, each edge stretches along its own axis, and the middle
     is left out entirely (no `fill` keyword) so the texture below shows through.
     --frmslice is how far in from the edge the artwork's border ends, as a percentage of
     the source, so any frame carries its own thickness. --frmw is that same fraction of
     the CELL's short side, measured in JS, which keeps corners square on any grid. */
  .cell .frm{position:absolute;inset:0;z-index:1;pointer-events:none;
    border-style:solid;border-width:var(--frmw,6px);
    border-image-slice:var(--frmslice,12%);
    border-image-repeat:stretch;border-image-width:1}
  /* The builtin bezel paints via the cell on rectangular grids, so its element must draw
     NOTHING there — a solid border with no border-image falls back to currentColor and
     renders black, which is exactly the failure that reached a live board. It only comes
     alive in ring mode below, where CSS cannot cut a shaped border any other way. */
  .cell .frm.gold{border-width:0;background-image:none}

  /* Logo bigger than its button: the cell normally clips its children (button texture,
     effect video, rounded corners), so spilling needs that clip lifted — but only for
     the logo. The effect video is pulled back inside so it doesn't bleed too.
     Grids that use clip-path (honeycomb, slant) still clip, by definition. */
  #board.logo-spill .cell{overflow:visible}
  #board.logo-spill .cell .vfx{inset:0;width:100%;height:100%}
  #board.logo-spill .cell img.logo{z-index:5}

  /* ---- v4: a custom button style REPLACES the stock bezel entirely ---- */
  #board.has-btnstyle{--logopad:calc(var(--tile) * (var(--logofrac) + .015))}
  /* a chosen texture or frame replaces the builtin entirely; this is only the small
     logo inset those looks want */

  /* ---- v4: grid styles (each still wears the chosen button style) ---- */
  #board.grid-checker{--radius:0px}
  #board.grid-checker{--bezel:calc(var(--tile) * .06)}
  #board.grid-checkerbare{--radius:0px}
  #board.grid-checkerbare .cell{border:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  #board.grid-honeycomb{--radius:0px;--logopad:calc(var(--tile) * (var(--logofrac) + .065))}
  #board.grid-honeycomb{--shape:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
    --ring:polygon(evenodd, 25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%,
      25% 0%, 31% 13%,69% 13%,87% 50%,69% 87%,31% 87%,13% 50%,31% 13%)}
  #board.grid-honeycomb .cell{border:none;box-shadow:none;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
  /* interlock the rows by splitting the half-tile offset, so the combined span of both
     rows is exactly the safe width — neither row can run past the crop edge */
  #board.grid-honeycomb .cell:nth-child(-n+16){left:calc(var(--tile) * -.25)}
  #board.grid-honeycomb .cell:nth-child(n+17){left:calc(var(--tile) * .25)}
  #board.grid-honeycomb .cell::before{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
  #board.grid-logos{--logopad:calc(var(--tile) * (var(--logofrac) - .145))}
  #board.grid-logos .cell{border:none;box-shadow:none;background-image:none !important}
  #board.grid-logos .cell img.tex,#board.grid-logos .cell .frm{display:none}
  /* RING MODE — shaped grids. 9-slice is rectangular by construction and cannot follow a
     hexagon, so instead the frame fills the cell clipped to the silhouette and the
     texture is laid on top, inset by the border width and clipped to the same shape.
     What is left showing is a border that traces the actual edge. */
  #board.grid-honeycomb .cell .frm,#board.grid-slant .cell .frm{
    border-width:0;background-size:100% 100%;background-repeat:no-repeat;
    clip-path:var(--ring)}
  #board.grid-honeycomb .cell .frm.gold,#board.grid-slant .cell .frm.gold{
    background-image:linear-gradient(145deg,#E8C07A 0%,#C08A45 17%,#8A5A26 52%,#6B3F17 76%,#B27A3E 100%)}
  /* "Checker (no edge)" means exactly that: no border, whatever is selected. */
  #board.grid-checkerbare .cell .frm{display:none}
  #board.grid-logos .cell::before{display:none}
  /* the one deliberately non-square grid: wide buttons stretched across the safe area */
  #board.grid-rect84{grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);
    justify-content:stretch;align-content:stretch;padding:12px var(--padx);
    --logopad:4px;--radius:6px;--bezel:3px}
  #board.grid-slant{--radius:0px}
  #board.grid-slant{--shape:polygon(16% 0%,100% 0%,84% 100%,0% 100%);
    --ring:polygon(evenodd, 16% 0%,100% 0%,84% 100%,0% 100%,
      16% 0%, 22% 13%,94% 13%,78% 87%,6% 87%,22% 13%)}
  #board.grid-slant .cell{border:none;
    clip-path:polygon(16% 0%,100% 0%,84% 100%,0% 100%)}
  #board.grid-slant .cell::before{clip-path:polygon(16% 0%,100% 0%,84% 100%,0% 100%)}
  /* v2: eliminate-only — picked teams simply dim (no X, no color change) */
  .cell.on{filter:brightness(.38) saturate(.55)}
  .cell.on img.logo{opacity:.55}
  .cell.slam{animation:slam .5s ease-out}
  @keyframes slam{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-2deg)}55%{transform:scale(.95) rotate(1deg)}100%{transform:scale(1)}}

  /* ---------- v3 button animations ---------- */
  .cell .vfx{position:absolute;inset:-14%;width:128%;height:128%;object-fit:cover;
    z-index:5;pointer-events:none;mix-blend-mode:screen;opacity:0;
    transition:opacity .28s linear}
  .cell.fx-video .vfx{opacity:calc(.55 + .45 * var(--fxi))}
  /* AMBIENT: effects play ONLY on highlighted teams, all on the same clock so the
     highlighted buttons pulse together. Nothing highlighted = nothing animates.
     fxIntensity controls BRIGHTNESS AND SIZE ONLY — every duration below is a fixed
     constant. Dividing the duration by --fxi used to make "more intense" also mean
     "faster", which is not what the slider says it does. */
  /* On a shaped grid the rectangular ring is replaced by an evenodd outline that follows
     the silhouette; --ring is undefined on rectangular grids, where border-radius is
     already right. The cell clips its children, so the glow lives inside the edge. */
  #board.grid-honeycomb .cell.hl::after,#board.grid-slant .cell.hl::after{
    border-radius:0 !important;clip-path:var(--ring);box-shadow:none !important}
  #board.anim-lightning.grid-honeycomb .cell.hl::after,
  #board.anim-lightning.grid-slant .cell.hl::after{background:var(--volt);border:0 !important}
  #board.anim-fire.grid-honeycomb .cell.hl::after,
  #board.anim-fire.grid-slant .cell.hl::after{background:rgba(255,120,20,.95)}
  /* The glow has to be LIGHT, not a coloured line. Two rules make that work:
     - filter applies BEFORE clip-path, so the shape and the glow cannot live on the same
       element — clipped together, the bleed is cut away and only flat colour survives.
       The ring is the inner <i>; the drop-shadows are on its parent.
     - the cell clips its children, so the outward bleed is trimmed and what reads on
       screen is the light spilling INWARD from the edge.
     Corner shape comes from --radius, so "checker" (radius 0) gets hard corners rather
     than the 8px the old rule hard-coded. */
  .cell .edge{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
  .cell .edge i{position:absolute;inset:0;display:block;border-radius:var(--radius)}
  /* GLOW: the tint sits on the frame (inset) and the light spills beyond the button.
     A cell own box-shadow escapes its overflow:hidden — only descendants are clipped —
     so this is the one place an outward glow can come from. The highlighted cell is
     lifted so its bleed is not painted over by the next tile.
     Alphas are pre-mixed in JS (--glowc-a/-b, --glowl-a/-b) rather than color-mix(),
     which needs a newer engine than some OBS builds ship. */
  /* Two halves, and they cannot share an element.
     THE RING sits ON TOP of the frame, so at full pulse the frame is completely covered
     by the glow colour. It has to be a real element: an inset box-shadow paints after the
     background but BEFORE children, so it can tint the builtin bezel yet never cover an
     image frame (.frm is a child). .edge is z-index 4, above .frm at 1.
     THE LIGHT is the cell own box-shadow, the only thing that escapes overflow:hidden. */
  #board.anim-glow .cell.hl .edge{animation:bglowring 2.6s ease-in-out infinite}
  #board.anim-glow .cell.hl .edge i{
    border:var(--glowring, 4px) solid var(--glowc);border-radius:var(--radius)}
  @keyframes bglowring{0%,100%{opacity:.22}50%{opacity:1}}
  /* half the spread of the first cut, and three stacked layers so it reads ~3x brighter —
     box-shadow light accumulates, which is the only way past alpha 1 */
  #board.anim-glow .cell.hl{z-index:6;animation:bglowedge 2.6s ease-in-out infinite}
  @keyframes bglowedge{
    0%,100%{box-shadow:
      0 0 calc(2px * var(--fxi)) var(--glowl-a),
      0 0 calc(4px * var(--fxi)) var(--glowl-a)}
    50%{box-shadow:
      0 0 calc(3px * var(--fxi))  calc(1px * var(--fxi)) var(--glowl-b),
      0 0 calc(6px * var(--fxi))  calc(1px * var(--fxi)) var(--glowl-b),
      0 0 calc(11px * var(--fxi)) calc(2px * var(--fxi)) var(--glowl-b)}}
  /* Shaped grids clip-path the cell, and clip-path DOES cut the box-shadow, so those keep
     the inner ring: an outward glow around a hexagon is not expressible here. */
  #board.grid-honeycomb.anim-glow .cell.hl,#board.grid-slant.anim-glow .cell.hl{
    box-shadow:none !important;animation:none}
  #board.grid-honeycomb.anim-glow .cell.hl .edge,
  #board.grid-slant.anim-glow .cell.hl .edge{
    filter:drop-shadow(0 0 calc(3px * var(--fxi)) var(--glowl-b))
           drop-shadow(0 0 calc(6px * var(--fxi)) var(--glowl-b))
           drop-shadow(0 0 calc(11px * var(--fxi)) var(--glowl-b));
    animation:bglowring 2.6s ease-in-out infinite}
  #board.grid-honeycomb.anim-glow .cell.hl .edge i,
  #board.grid-slant.anim-glow .cell.hl .edge i{border:0}
  /* shaped grids: the ring is a clipped band instead of a border */
  #board.grid-honeycomb.anim-glow .cell.hl .edge i,
  #board.grid-slant.anim-glow .cell.hl .edge i{
    border:0;background:var(--glowc, var(--gold));clip-path:var(--ring)}
  @keyframes bglow{0%,100%{opacity:calc(.12 * var(--fxi))}50%{opacity:calc(.85 * var(--fxi))}}
  #board.anim-fire .cell.hl::after{content:"";position:absolute;inset:-2px;border-radius:10px;
    z-index:4;pointer-events:none;
    background:linear-gradient(0deg,rgba(255,140,20,.85),rgba(255,60,0,.25) 45%,transparent 70%);
    filter:blur(3px);animation:bfire 1.5s ease-in-out infinite alternate}
  @keyframes bfire{0%{opacity:calc(.35 * var(--fxi));transform:translateY(2px) scaleY(.96)}
    100%{opacity:calc(.9 * var(--fxi));transform:translateY(calc(-2px * var(--fxi))) scaleY(calc(1 + .04 * var(--fxi)))}}
  #board.anim-lightning .cell.hl::after{content:"";position:absolute;inset:-1px;border-radius:10px;
    z-index:4;pointer-events:none;border:calc(2px * var(--fxi)) solid var(--volt);
    box-shadow:0 0 calc(12px * var(--fxi)) var(--volt),inset 0 0 calc(8px * var(--fxi)) var(--volt);
    opacity:0;animation:blight 3.4s linear infinite}
  @keyframes blight{0%,86%{opacity:0}88%{opacity:calc(min(1, .4 + .6 * var(--fxi)))}
    90%{opacity:calc(.15 * var(--fxi))}92%{opacity:calc(min(1, .4 + .6 * var(--fxi)))}96%{opacity:0}}
  #board.anim-glitch .cell.hl{animation:bglitch 3.2s steps(1,end) infinite}
  @keyframes bglitch{0%,90%{transform:none;filter:none}
    91%{transform:translateX(-3px);filter:hue-rotate(80deg) saturate(2)}
    93%{transform:translateX(3px);filter:hue-rotate(-60deg)}
    95%{transform:translateX(-1px)}97%{transform:none;filter:none}}
  /* TRIGGER: fires on the team that was just hit */
  .cell.fx-pop{animation:bpop .85s cubic-bezier(.22,1.4,.3,1);z-index:7}
  @keyframes bpop{0%{transform:scale(1)}35%{transform:scale(1.55);filter:brightness(1.6)}
    60%{transform:scale(1.42)}82%{transform:scale(.9)}100%{transform:scale(1)}}
  .cell .dust{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;
    background:rgba(255,240,210,.9);box-shadow:0 0 6px rgba(255,220,160,.9);z-index:8;
    animation:dust .8s ease-out forwards}
  @keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

  #banners{left:0;top:645px;width:1080px;height:97px;overflow:hidden;background:#06111b}
  #banners .b{position:absolute;inset:0;transform:translate3d(-100%,0,0);
    transition:transform .8s cubic-bezier(.37,0,.63,1);
    will-change:transform;backface-visibility:hidden}
  #banners .b.live{transform:translate3d(0,0,0)}
  #banners .b.out{transform:translate3d(100%,0,0)}
  #banners .b img,#banners .b video{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
  #banners .b .txt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--bone);font-size:44px;letter-spacing:1px;text-transform:uppercase;
    text-shadow:0 3px 0 #000,0 0 18px rgba(53,167,255,.6);padding:0 40px;text-align:center;
    background:linear-gradient(90deg,var(--navy-deep),var(--steel),var(--navy-deep))}

  /* ---------- FX LAYER (full canvas; focus box 667x413 @207,800) ---------- */
  #layer-fx{inset:0;display:none;pointer-events:none}
  /* One-shots and stingers render inside a CLIPPING box. Without it a reframe zoom
     (transform:scale) would spill across the whole canvas instead of cropping within
     the frame — which is why zoom never worked on these. The box owns the geometry;
     the media just fills it. */
  .fxbox{position:absolute;inset:0;display:none;overflow:hidden;z-index:20;pointer-events:none}
  /* v2: one-shot animations play INSIDE the ANIM focus box, per the layout key */
  .fxbox.boxed{inset:auto;left:207px;top:800px;width:667px;height:413px}
  /* "fill the section": cover the whole lower camera region instead of the small box */
  .fxbox.full{inset:auto;left:0;top:645px;width:1080px;height:1275px}
  #fxVideo{width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .35s ease}
  #fxVideo.fit-contain{object-fit:contain}
  #fxImg{width:100%;height:100%;object-fit:contain;opacity:0}
  #fxImg.fit-cover{object-fit:cover}
  #fxImg.go{animation:still 3s ease-out forwards}
  /* --rfz is the reframe zoom; the pop composes with it instead of overriding it —
     a running animation outranks an inline transform, so this has to multiply in */
  @keyframes still{0%{opacity:0;transform:scale(calc(var(--rfz,1) * .82))}12%{opacity:1}
    85%{opacity:1;transform:scale(calc(var(--rfz,1) * 1.02))}
    100%{opacity:0;transform:scale(calc(var(--rfz,1) * 1.04))}}
  #burst{position:absolute;left:207px;top:800px;width:667px;height:413px;display:none;z-index:21}
  #burst .ring{position:absolute;left:50%;top:50%;width:80px;height:80px;border-radius:50%;
    border:6px solid var(--volt);transform:translate(-50%,-50%);
    animation:ring 1.5s cubic-bezier(.1,.8,.2,1) forwards;box-shadow:0 0 30px var(--volt)}
  @keyframes ring{to{width:1400px;height:1400px;opacity:0;border-width:1px}}
  #burst .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);
    width:300px;height:300px;border-radius:36px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.25), rgba(7,21,39,.92) 70%);
    border:4px solid var(--gold);box-shadow:0 0 60px 10px var(--team,#35A7FF),inset 0 0 40px rgba(0,0,0,.6);
    /* gentle overshoot: even mid-pop the tilted core's bounds stay inside ANIM 667x413 */
    animation:core 2.4s cubic-bezier(.2,1.2,.3,1) forwards}
  #burst .core img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.8))}
  #burst .core.bare{background:transparent;border:none;box-shadow:none}
  @keyframes core{0%{transform:translate(-50%,-50%) scale(0) rotate(-14deg)}
    55%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}
    75%{transform:translate(-50%,-50%) scale(1)}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  #burst.fadeout .core{animation:coreout .4s ease-in forwards}
  @keyframes coreout{to{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
  #burst .p{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:3px;
    background:var(--team,#35A7FF);box-shadow:0 0 10px var(--team,#35A7FF);
    animation:p 1.6s ease-out forwards}
  @keyframes p{to{transform:translate(var(--dx),var(--dy)) rotate(560deg) scale(.2);opacity:0}}
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.85),transparent 60%);
    opacity:0;z-index:19}
  #flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

  /* ---------- debug guides ---------- */
  #debug{inset:0;display:none;pointer-events:none;z-index:99}
  #debug div{position:absolute;border:2px dashed;font:700 18px monospace;color:#fff;padding:4px}
</style>
</head>
<body>

<div id="layer-bg" class="abs">
  <div id="bgFrame" class="abs"><div class="fade"></div></div>
</div>

<div id="layer-hud" class="abs">
  <div id="board" class="abs"></div>
  <div id="banners" class="abs"></div>
</div>

<div id="layer-fx" class="abs">
  <div id="flash"></div>
  <div id="fxVidBox" class="fxbox"><video id="fxVideo" playsinline></video></div>
  <div id="fxImgBox" class="fxbox"><img id="fxImg" alt=""></div>
  <div id="burst"></div>
</div>

<div id="debug" class="abs"></div>

<script>
(() => {
  const C = window.ACBZ, G = C.GEOM;
  const $ = (s) => document.querySelector(s);
  const layer = C.LAYER, PC = C.DEVICE;
  const show = (id) => { $(id).style.display = "block"; };
  if (layer === "bg"  || layer === "all") show("#layer-bg");
  if (layer === "hud" || layer === "all") show("#layer-hud");
  if (layer === "fx"  || layer === "all") show("#layer-fx");
  /* Showing a layer is only display:none — WITHOUT these gates every source still
     downloads every asset, so each PC pulled the same background three times and the
     fx/bg sources pulled board art and banners they can never render. Measured: 14.4 MB
     of wasted background per source per load. Gate the FETCH, never the bookkeeping —
     applyState/applyBoardParts must still track state identically on all three. */
  const BG_LAYER  = (layer === "bg"  || layer === "all");
  const HUD_LAYER = (layer === "hud" || layer === "all");

  /* ---------------- board cells (v2: all logos always visible) ---------------- */
  const boardEl = $("#board");
  const cells = {};
  C.ORDER.forEach((abbr) => {
    const t = C.TEAMS[abbr];
    const d = document.createElement("div");
    d.className = "cell";
    /* the cell still exists on every layer — applyState toggles .on/.hl on it — but only
       the HUD source paints it. The FX source builds its own logo per stinger. */
    if (HUD_LAYER) d.innerHTML = `<img class="logo" src="${C.LOGO_URL(abbr)}" alt="${t.name}">` +
      `<div class="edge"><i></i></div>`;
    boardEl.appendChild(d); cells[abbr] = d;
  });

  /* ------- board style parts: buttons / background / button animation (v3) ------- */
  const AMBIENT = ["glow","fire","lightning","glitch"];
  const GRIDS = ["buttons","checker","checkerbare","honeycomb","logos","rect84","slant"];
  /* WhatNot-safe tile area, measured from the original board art:
     x 111..968 (858 wide) inside the 1080x165 band; original tiles are 53x53. */
  const SAFE_W = 858, SAFE_H = 141, MAX_TILE = 53;
  const GRID_CFG = {
    buttons:{cols:16,rows:2}, checker:{cols:16,rows:2}, checkerbare:{cols:16,rows:2},
    honeycomb:{cols:16,rows:2,slack:0.5},           // row 2 is offset half a tile
    logos:{cols:16,rows:2}, slant:{cols:16,rows:2},
    rect84:{cols:8,rows:4,stretch:true},            // deliberately rectangular
  };
  /* biggest SQUARE tile that keeps every button inside the safe area at this spacing */
  function tileFor(grid, gap) {
    const c = GRID_CFG[grid] ?? GRID_CFG.buttons;
    const byWidth  = (SAFE_W - (c.cols - 1) * gap) / (c.cols + (c.slack ?? 0));
    const byHeight = (SAFE_H - (c.rows - 1) * gap) / c.rows;
    return Math.max(12, Math.floor(Math.min(MAX_TILE, byWidth, byHeight)));
  }
  let partsKey = null, boardBgSig = null, btnAnims = [], fxClips = [], lastHlKey = null;
  /* One texture/frame image per cell, fitted with object-fit:cover so it scales
     uniformly and CROPS rather than stretching to the cell box — which is what
     background-size:100% 100% was doing on every non-square grid. Reuses applyCrop for
     Reframe zoom/pan, exactly like the board background and the FX layer.
     Never rebuilds an element whose src is unchanged: a fresh <img> refetches and blinks,
     the same reason paintClips seeks instead of recreating. */
  function setCellLayer(cell, cls, asset) {
    const url = asset?.url || null;
    const tex = cls === "tex";
    /* The builtin bezel has no image, but on a shaped grid it still needs an element to
       paint the ring into — CSS alone cannot cut a hexagonal border out of a cell. */
    const builtinFrame = !tex && !url && !!asset?.meta?.builtin;
    let el = cell.querySelector(tex ? "img.tex" : "div.frm");
    if (!url && !builtinFrame) { el?.remove(); return; }
    if (!el) {
      el = document.createElement(tex ? "img" : "div");
      el.className = cls;
      cell.insertBefore(el, cell.firstChild);
    }
    /* Only the SRC is skip-guarded — reassigning it refetches and blinks. The crop must
       be reapplied every time or a crop-only edit silently does nothing, which is the
       same early-return trap applyBoardParts' change key already had to be fixed for. */
    el.classList.toggle("gold", builtinFrame);
    if (el.dataset.src !== (url || "builtin")) {
      el.dataset.src = url || "builtin";
      if (tex) el.src = url;
      else if (url) {
        el.style.borderImageSource = `url("${url}")`;   // 9-slice on rectangular grids
        el.style.backgroundImage  = `url("${url}")`;    // ring on shaped grids
      } else { el.style.borderImageSource = "none"; el.style.backgroundImage = ""; }
    }
    if (tex) applyCrop(el, asset.meta ?? asset);
  }

  function applyBoardParts(s) {
    const btn = s?.boardButtons, bg = s?.boardBg;
    /* "Gold Buttons" used to be one welded look: copper bezel + teal fill. It is now two
       builtins, so a board that has never chosen a frame must keep exactly what it had —
       the bezel only if it was wearing the full builtin (no custom texture). An explicit
       null means the operator turned the frame OFF and must be honoured, so this tests
       for undefined, not falsiness. */
    const frame = s?.boardFrame !== undefined ? s.boardFrame
      : (btn?.url ? null : { name: "Gold Buttons", meta: { builtin: true, domain: "button_frame" } });
    /* one or many button animations may be active at once */
    const anims = (Array.isArray(s?.buttonAnims) ? s.buttonAnims
                  : s?.buttonAnim ? [s.buttonAnim] : []).filter(Boolean);
    const grid = GRIDS.includes(s?.boardGrid) ? s.boardGrid : "buttons";
    const gap = Math.max(-20, Math.min(20, Number(s?.boardGap ?? 0)));  // negative = overlap
    const size = Math.max(40, Math.min(150, Number(s?.boardSize ?? 100)));
    const logo = Math.max(60, Math.min(200, Number(s?.logoSize ?? 100)));
    const fxi = Math.max(0.3, Math.min(2.5, Number(s?.fxIntensity ?? 100) / 100));
    /* The crops MUST be in this key. Without them a reframe of the board background or
       the button texture changed nothing on screen, because this early return fired
       before any of the code below could apply it. */
    const cropOf = (a) => JSON.stringify(a?.meta?.crop ?? a?.crop ?? null);
    const hex = (v) => /^#[0-9a-f]{6}$/i.test(String(v ?? "")) ? v : "";
    const glowc = hex(s?.glowColor) || "#D9A441";
    const glowl = hex(s?.glowLight) || glowc;     // unset = same hue, so they blend
    const key = [btn?.url, cropOf(btn), frame?.url, cropOf(frame), frame?.meta?.builtin,
      glowc, glowl,
      bg?.url, cropOf(bg), grid, gap, size, logo, fxi,
      anims.map(a => a.id + (a.meta?.effect ?? "") + (a.url ?? "")).join(",")].join("|");
    if (key === partsKey) return false; partsKey = key;

    /* grid shape + spacing (buttons touch at gap 0, and are square unless it's 8x4) */
    GRIDS.forEach(g => boardEl.classList.remove("grid-" + g));
    boardEl.classList.add("grid-" + grid);
    const cfg = GRID_CFG[grid] ?? GRID_CFG.buttons;
    /* CSS `gap` cannot be negative, so overlap is done by shrinking the TRACK below
       the tile and letting each cell overflow its own track by exactly |gap|. */
    boardEl.style.setProperty("--gap", Math.max(0, gap) + "px");
    boardEl.style.setProperty("--cols", cfg.cols);
    boardEl.style.setProperty("--rows", cfg.rows);
    /* size is a percentage of the biggest tile that still fits the safe area.
       Above 100% the row is wider than the safe area, so give back the board's own
       111px padding as needed — without this the outer teams would be cut off by the
       board's 1080px edge. Past ~127% there is no padding left to give and clipping
       is unavoidable; that is the operator's call. */
    const tile = Math.max(10, Math.round(tileFor(grid, gap) * size / 100));
    boardEl.style.setProperty("--tile", cfg.stretch ? "auto" : tile + "px");
    boardEl.style.setProperty("--track",
      cfg.stretch ? "auto" : Math.max(4, tile + Math.min(0, gap)) + "px");
    const spanned = cfg.stretch ? 0 : cfg.cols * tile + (cfg.cols - 1) * gap;
    boardEl.style.setProperty("--padx",
      Math.max(0, Math.min(111, Math.floor((1080 - spanned) / 2))) + "px");
    /* Logo scale lives in the padding around it, so the button frame never changes.
       Up to 100% this is the original curve, unchanged. Past 100% the padding keeps
       going and turns NEGATIVE, which is what lets a big logo spill outside its
       button — at 200% the logo is ~140% of the tile. */
    const logofrac = logo <= 100
      ? 0.30 - (logo / 100) * 0.145                       // 60%->.213  100%->.155
      : 0.155 - (logo - 100) * 0.0051;                     // 150%->-.100  200%->-.355
    boardEl.style.setProperty("--logofrac", logofrac.toFixed(3));
    /* a spilling logo has to escape the button's own clip */
    boardEl.classList.toggle("logo-spill", logofrac < 0);
    boardEl.style.setProperty("--fxi", fxi);
    /* Pre-mix the alphas here: the keyframes need a dim and a bright value for each
       colour, and animating alpha through color-mix() is not safe on older CEF. Both
       values are parsed from a validated #rrggbb, so nothing unchecked reaches CSS. */
    const rgba = (h, a) => {
      const v = parseInt(h.slice(1), 16);
      return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
    };
    boardEl.style.setProperty("--glowc",   glowc);
    boardEl.style.setProperty("--glowc-a", rgba(glowc, .30));
    boardEl.style.setProperty("--glowc-b", rgba(glowc, .95));
    boardEl.style.setProperty("--glowl-a", rgba(glowl, .18));
    boardEl.style.setProperty("--glowl-b", rgba(glowl, .95));
    boardEl.classList.toggle("has-btnstyle", !!(btn?.url || frame?.url));
    /* Builtins are CSS, not images, and the two are now independent: a board can wear the
       copper frame with any fill, or a custom fill with no frame at all. */
    boardEl.classList.toggle("btn-teal",   !btn?.url);
    boardEl.classList.toggle("frame-gold", !frame?.url && !!frame?.meta?.builtin);

    /* Background: still image or looping video behind the grid. Rebuilding this on every
       unrelated change (intensity, grid, spacing) restarted the clip from black, so only
       touch it when the background itself actually changed. */
    const bgSig = bg?.url ? bg.url + "|" + JSON.stringify(bg.meta?.crop ?? bg.crop ?? null) : "";
    if (HUD_LAYER && bgSig !== boardBgSig) {
      boardBgSig = bgSig;
      clearLoopers(boardEl);
      boardEl.querySelectorAll("video.boardbg").forEach(n => n.remove());
      boardEl.style.backgroundImage = "";
      if (bg?.url && /\.(webm|mp4)(\?|$)/i.test(bg.url)) {
        boardEl.insertBefore(makeLoop(bg.url, bg.meta ?? bg, 0), boardEl.firstChild);
      } else if (bg?.url) {
        /* a real <img> rather than a CSS background, so Reframe pan/zoom can apply —
           a background-image has no element to transform */
        boardEl.insertBefore(makeStill(bg.url, bg.meta ?? bg, 0), boardEl.firstChild);
      }
    }

    /* buttons: texture on every cell. Reframe crop is expressed as background
       position/size here for the same reason — there is no element per cell. */
    /* 9-slice needs a real border WIDTH, and it has to track the cell so the frame stays
       proportional at any board size or grid. Measure the cell rather than deriving it:
       rect84 stretches its tracks, so --tile says "auto" there and tells us nothing. */
    const frac = Math.max(.02, Math.min(.45, Number(frame?.meta?.sliceFrac) || .12));
    boardEl.style.setProperty("--frmslice", (frac * 100).toFixed(2) + "%");
    for (const abbr of C.ORDER) {
      cells[abbr].style.backgroundImage = "";        // v4 left this behind on some cells
      setCellLayer(cells[abbr], "tex", HUD_LAYER ? btn : null);
      setCellLayer(cells[abbr], "frm", HUD_LAYER ? frame : null);
    }
    {
      const r = cells[C.ORDER[0]].getBoundingClientRect();
      const short = Math.min(r.width, r.height) || tile;      // 0 while the layer is hidden
      if (frame?.url) boardEl.style.setProperty("--frmw", Math.max(2, Math.round(short * frac)) + "px");
      boardEl.style.setProperty("--logoglow", (short * 0.015).toFixed(2) + "px");
      /* The glow ring must land ON the frame band so a full pulse hides it completely:
         an image frame is --frmw wide, the builtin bezel is --bezel (.1 of the tile), and
         with no frame at all a thin rim still reads as an edge. */
      const ringPx = frame?.url ? Math.max(2, Math.round(short * frac))
        : frame ? Math.max(2, Math.round(short * 0.1))
        : Math.max(2, Math.round(short * 0.055));
      boardEl.style.setProperty("--glowring", ringPx + "px");
    }

    /* button animations: every selected ambient effect runs at once, on one clock */
    AMBIENT.forEach(e => boardEl.classList.remove("anim-" + e));
    btnAnims = anims;
    for (const a of anims) {
      const eff = a?.meta?.effect;
      if (eff && AMBIENT.includes(eff)) boardEl.classList.add("anim-" + eff);
    }
    /* AI-generated clips loop continuously over each highlighted button */
    fxClips = HUD_LAYER
      ? anims.filter(a => a.url && /\.(webm|mp4)(\?|$)/i.test(a.url)).map(a => a.url) : [];
    return true;                       // caller restarts everything once, in sync
  }

  /* Keep a looping clip on every highlighted cell (and only those).
     restart=true re-syncs the clips by SEEKING them, never by rebuilding them: a fresh
     <video> starts at readyState 0 and shows nothing until the file has buffered again,
     which is what made every settings change look like the effects had stopped for good.
     Elements are only created when the clip changes or a cell is newly highlighted. */
  function paintClips(restart) {
    const url = fxClips[0] ?? null;
    for (const abbr of C.ORDER) {
      const cell = cells[abbr];
      const want = !!url && cell.classList.contains("hl");
      const have = cell.querySelector("video.vfx");
      if (!want) { if (have) { cell.classList.remove("fx-video"); have.remove(); } continue; }
      if (have && have.dataset.src === url) {          // already buffered — just re-sync it
        if (restart) { try { have.currentTime = 0; } catch (e) {} have.play().catch(() => {}); }
        continue;
      }
      have?.remove();
      /* autoplay (not a bare play() call) so a freshly built clip starts the moment it
         has data — nothing else in this path would ever start it */
      const v = Object.assign(document.createElement("video"),
        { src: url, muted: true, loop: true, autoplay: true, playsInline: true,
          preload: "auto", className: "vfx" });
      v.dataset.src = url;
      cell.appendChild(v); cell.classList.add("fx-video");
    }
  }

  /* Stop everything and start it again on one clock, so every highlighted button is in
     step. Runs after ANY change; the effects themselves only disappear when a team is
     unhighlighted or eliminated. */
  function restartEffects() {
    const active = AMBIENT.map(e => "anim-" + e).filter(c => boardEl.classList.contains(c));
    active.forEach(c => boardEl.classList.remove(c));
    void boardEl.offsetWidth;               // reflow while nothing is animating
    active.forEach(c => boardEl.classList.add(c));
    paintClips(true);                       // clips seek back to 0 on the same tick
  }
  /* trigger-mode effects fire on the single cell that was just hit
     (suppressed when highlight mode is on and this team isn't highlighted) */
  function triggerButtonAnim(abbr) {
    const cell = cells[abbr]; if (!cell || !btnAnims.length) return;
    if (!cell.classList.contains("hl")) return;   // effects only on highlighted teams
    const m = btnAnims.find(a => a.meta?.mode === "trigger" || a.meta?.effect === "pop")?.meta;
    if (!m || m.effect === "none") return;
    {
      cell.classList.remove("fx-pop"); void cell.offsetWidth; cell.classList.add("fx-pop");
      for (let i = 0; i < 10; i++) {                                 // dust puff on the slam
        const d = document.createElement("span"); d.className = "dust";
        const a = Math.random()*Math.PI*2, r = 26 + Math.random()*34;
        d.style.setProperty("--dx", `${Math.cos(a)*r}px`);
        d.style.setProperty("--dy", `${Math.sin(a)*r}px`);
        d.style.animationDelay = `${0.34 + Math.random()*0.12}s`;
        cell.appendChild(d); setTimeout(() => d.remove(), 1400);
      }
      setTimeout(() => cell.classList.remove("fx-pop"), 900);
    }
  }

  /* ---------------- banner rotator ---------------- */
  const banEl = $("#banners");
  /* reframe: pan (x/y %) + zoom (z %, 100 = fit) — used by banners and backgrounds */
  const cropCss = (m) => {
    const c = m?.crop; if (!c) return "";
    const z = Math.max(1, Math.min(6, (c.z ?? 100) / 100));   // 600% — matches #rfZ
    return `object-position:${c.x ?? 50}% ${c.y ?? 50}%;transform:scale(${z});`;
  };
  const applyCrop = (node, m) => {
    const c = m?.crop; if (!node) return;
    node.style.objectPosition = c ? `${c.x ?? 50}% ${c.y ?? 50}%` : "";
    node.style.transform = c?.z ? `scale(${Math.max(1, Math.min(6, c.z / 100))})` : "";
  };

  /* Seamless looper: AI clips rarely loop cleanly, so run two copies of the file and
     crossfade at the seam — the jump is never visible. Returns a positioned wrapper. */
  const XFADE = 0.55;
  function makeLoop(url, cropMeta, z) {
    const wrap = document.createElement("div");
    wrap.className = "looper";
    wrap.style.cssText = `position:absolute;inset:0;overflow:hidden;z-index:${z ?? 0};pointer-events:none`;
    const mk = () => {
      const v = Object.assign(document.createElement("video"),
        { src: url, muted: true, playsInline: true, preload: "auto" });
      v.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" +
        `transition:opacity ${XFADE}s linear;opacity:0`;
      applyCrop(v, cropMeta);
      wrap.appendChild(v); return v;
    };
    let cur = mk(), nxt = mk();
    cur.style.opacity = "1";
    cur.addEventListener("loadedmetadata", () => cur.play().catch(()=>{}), { once: true });
    const tick = () => {
      const d = cur.duration;
      if (d && cur.currentTime >= d - XFADE && nxt.paused) {
        nxt.currentTime = 0; nxt.play().catch(()=>{});
        nxt.style.opacity = "1"; cur.style.opacity = "0";
        const finished = cur;
        setTimeout(() => { finished.pause(); finished.currentTime = 0; }, XFADE * 1000);
        [cur, nxt] = [nxt, cur];
      }
      wrap._raf = requestAnimationFrame(tick);
    };
    wrap._raf = requestAnimationFrame(tick);
    wrap._stop = () => cancelAnimationFrame(wrap._raf);
    return wrap;
  }
  /* The still-image twin of makeLoop: same positioned, clipping wrapper, so a
     Reframe zoom crops inside the frame instead of doing nothing (a CSS
     background-image cannot be panned or zoomed by transform). */
  function makeStill(url, cropMeta, z) {
    const wrap = document.createElement("div");
    wrap.className = "looper";
    wrap.style.cssText = `position:absolute;inset:0;overflow:hidden;z-index:${z ?? 0};pointer-events:none`;
    const im = Object.assign(document.createElement("img"), { src: url });
    im.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover";
    applyCrop(im, cropMeta);
    wrap.appendChild(im);
    return wrap;
  }
  const clearLoopers = (root) => root.querySelectorAll(".looper")
    .forEach(n => { n._stop?.(); n.remove(); });
  /* Resolves when the media can actually be painted, rejects when it cannot. decode()
     covers fetch AND decode in one wait; the timeout stops one hung file freezing the
     whole rotation. */
  /* 8s, not 4s, and the reason comes back with the rejection. A stream PC is uploading video
     while these fetch, with three browser sources sharing the uplink, so 4s was tight enough
     that ordinary load latency counted as "this file is broken". */
  function mediaReady(el, ms = 8000) {
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej("timeout"), ms);
      const ok = () => { clearTimeout(t); res(); };
      const no = () => { clearTimeout(t); rej("error"); };
      if (el.tagName === "IMG") {
        if (el.decode) el.decode().then(ok, no);
        else if (el.complete && el.naturalWidth) ok();
        else { el.onload = ok; el.onerror = no; }
      } else {
        if (el.readyState >= 2) ok();
        else { el.onloadeddata = ok; el.onerror = no; }
      }
    });
  }

  /* Failed URLs back off; they are NOT blacklisted for the session.

     The original was a Set that never expired, on the reasoning that "a reload clears this
     anyway" — but an OBS browser source is a session that runs for DAYS. So one slow load
     (mediaReady rejected at 4s, while the same machine is uploading a stream) removed a
     banner until somebody physically refreshed the source. That is exactly the "reset the
     cache and it works for a while" report, and nobody can walk to five PCs to do it.

     Backoff keeps the property that actually mattered. The orphaned banner that generated
     ~330 requests an hour (8,765 in 48h, 87% of all Supabase traffic) settles at the 30
     minute cap — about 2 requests an hour per source — while anything transient heals
     itself within a rotation cycle or two. A hard error waits longer than a timeout,
     because a 404 is more likely to still be a 404 than a slow fetch is to still be slow. */
  const MEDIA_BACKOFF = [20e3, 60e3, 5 * 60e3, 15 * 60e3, 30 * 60e3];
  const mediaFails = new Map();                 // url -> { until, n }
  const isDeadNow = (url) => {
    const e = mediaFails.get(url);
    return !!e && Date.now() < e.until;
  };
  const markFailed = (url, hard) => {
    const e = mediaFails.get(url) ?? { n: -1 };
    e.n = Math.min(e.n + 1, MEDIA_BACKOFF.length - 1);
    const wait = MEDIA_BACKOFF[hard ? Math.max(e.n, 2) : e.n];
    e.until = Date.now() + wait;
    mediaFails.set(url, e);
    return wait;
  };
  /* one success wipes the history, so a file that was briefly unreachable is a first-class
     citizen again rather than carrying a long backoff around for the rest of the day */
  const markOk = (url) => { if (url) mediaFails.delete(url); };

  const rotator = {
    list: [], i: -1, timer: null, shownId: null, gen: 0,
    setList(list) {
      if (!HUD_LAYER) return;   // the banner band lives in #layer-hud only
      const same = JSON.stringify((list||[]).map(a=>[a.id,a.meta?.crop])) ===
                   JSON.stringify(this.list.map(a=>[a.id,a.meta?.crop]));
      this.list = list || [];
      if (!same) { this.i = -1; this.next(); }
      if (!this.list.length) { clearTimeout(this.timer); this.gen++; banEl.innerHTML=""; this.shownId = null; }
    },
    next() {
      clearTimeout(this.timer);
      if (!this.list.length) return;
      /* With ONE banner in rotation there is nothing to slide to. The old crossfade
         hid this — dissolving an image into an identical copy is invisible — but a
         slide would scroll the same artwork across the band every cycle. Hold it. */
      if (this.list.length === 1 && this.shownId === this.list[0].id
          && banEl.querySelector(".b.live")) {
        this.timer = setTimeout(() => this.next(), C.bannerSeconds(this.list[0]) * 1000);
        return;
      }
      this.i = (this.i + 1) % this.list.length;
      this.show(this.list[this.i], 0);
    },

    /* Build the banner off-canvas and slide ONLY once its media can actually paint.
       The old order — append, slide, discover the file is broken, restart — was
       measurable: the band snapped back to the left edge mid-travel every time the
       rotation reached a dead file. A slow file did the same thing more quietly, by
       sliding in blank. Waiting costs nothing visible: it happens during the dwell. */
    show(a, tried) {
      const gen = ++this.gen;
      /* known-bad: move on without building an element, so nothing is requested at all */
      if (a.url && isDeadNow(a.url)) return this.skipTo(a, tried, gen);
      const b = document.createElement("div"); b.className = "b";
      if (a.meta?.type === "text" && !a.url) {
        b.innerHTML = `<div class="txt">${(a.meta.text||"").replace(/</g,"&lt;")}</div>`;
      } else if (/\.(webm|mp4)(\?|$)/i.test(a.url||"")) {
        b.innerHTML = `<video src="${a.url}" autoplay muted loop playsinline style="${cropCss(a.meta)}"></video>`;
      } else {
        b.innerHTML = `<img src="${a.url}" style="${cropCss(a.meta)}">`;
      }

      const slide = () => {
        if (gen !== this.gen) return;            // the list changed while we were waiting
        banEl.appendChild(b);
        while (banEl.children.length > 2) banEl.firstChild.remove();
        /* Start both halves in the SAME frame: if the outgoing banner began moving even
           one frame early, a sliver of the empty band would show between them. */
        const leaving = [...banEl.children].slice(0, -1);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (gen !== this.gen || !b.isConnected) return;
          b.classList.add("live");
          leaving.forEach(n => { n.classList.remove("live"); n.classList.add("out"); });
        }));
        this.shownId = a.id;
        this.timer = setTimeout(() => this.next(), C.bannerSeconds(a) * 1000);
      };
      const skip = (why) => {
        if (a.url) {
          const wait = markFailed(a.url, why === "error");
          console.warn(`[acbz] banner "${a.name}" ${why}; retrying in ${Math.round(wait / 1000)}s`);
        }
        this.skipTo(a, tried, gen);
      };

      const media = b.querySelector("img,video");
      if (!media) return slide();                 // text banner: nothing to load
      mediaReady(media).then(() => { markOk(a.url); slide(); }, skip);
    },

    /* move to the next candidate while the failed one is still off-canvas */
    skipTo(a, tried, gen) {
      if (gen !== this.gen) return;
      if (tried + 1 < this.list.length) {
        this.i = (this.i + 1) % this.list.length;
        this.show(this.list[this.i], tried + 1);
      } else {                                    // nothing in the list loads — retry later
        this.timer = setTimeout(() => this.next(), 5000);
      }
    },
  };

  /* ---------------- background (with reframe crop) ---------------- */
  let bgKey = null;
  let bgWanted = null;

  /* The background is built once per url+crop and then never looked at again — setBackground
     early-returns on an unchanged key, which is the right call for avoiding a rebuild storm and
     the wrong one when the single build FAILED. A blip during that one load left the frame
     empty for the life of the source, with no retry: the other half of "I reset the OBS cache
     and it came back".
     So: check periodically that what is on screen is actually painting, and rebuild if not.
     Cheap (a property read every 20s), silent when healthy, and it cannot loop — a rebuild only
     happens when the element is genuinely broken, and a broken rebuild backs off with the same
     table the banners use. */
  const bgBroken = (el) => {
    if (!el) return true;
    if (el.tagName === "VIDEO") return !!el.error || el.readyState < 2;
    return el.complete && !el.naturalWidth;      // decoded to nothing
  };
  if (BG_LAYER) setInterval(() => {
    if (!bgWanted?.url || isDeadNow(bgWanted.url)) return;
    const el = $("#bgFrame").querySelector("video,img");
    if (!bgBroken(el)) { markOk(bgWanted.url); return; }
    const wait = markFailed(bgWanted.url, !!el?.error);
    console.warn(`[acbz] background not painting — rebuilding, next check backs off ${Math.round(wait / 1000)}s`);
    bgKey = null;                                // defeat the early return
    setBackground(bgWanted);
  }, 20000);
  function setBackground(bg) {
    if (!BG_LAYER) return;      // the hud/fx sources never render it — do not fetch it
    bgWanted = bg ?? null;      // what SHOULD be on screen, for the watchdog below
    const key = bg?.url ? bg.url + JSON.stringify(bg.crop ?? null) : null;
    if (key === bgKey) return; bgKey = key;
    const f = $("#bgFrame");
    clearLoopers(f);
    f.querySelectorAll("video,img").forEach(n => n.remove());
    if (!bg?.url) return;
    if (/\.(webm|mp4)(\?|$)/i.test(bg.url)) {          // seamless crossfade loop
      f.insertBefore(makeLoop(bg.url, bg), f.firstChild);
      return;
    }
    const n = Object.assign(document.createElement("img"), {src:bg.url});
    applyCrop(n, bg);
    f.insertBefore(n, f.firstChild);
  }

  /* ---------------- FX ---------------- */
  const fxQ = []; let fxBusy = false;
  /* keep a reference until it finishes — a bare `new Audio().play()` can be collected
     mid-load, which silently aborts the request and eats the sound */
  const sfxLive = new Set();
  /* Only the FX source makes sound. Otherwise all three browser sources play the same
     clip at once (and you still hear audio even when the FX source is missing, which
     makes a missing layer look like a broken animation). */
  const AUDIO_LAYER = (layer === "fx" || layer === "all");
  function sfx(url, vol=1){
    if(!url || !AUDIO_LAYER) return;
    try{
      const a = new Audio(url); a.volume = vol; sfxLive.add(a);
      const drop = () => sfxLive.delete(a);
      a.onended = a.onerror = drop; setTimeout(drop, 15000);
      a.play().catch(drop);
    }catch(e){}
  }
  function runFx(job){ fxQ.push(job); pump(); }
  const fxV = $("#fxVideo"), fxVBox = $("#fxVidBox");
  const fxI = $("#fxImg"),   fxIBox = $("#fxImgBox");
  fxV.addEventListener("timeupdate", () => {   // safety fade even if the file lacks one
    if (fxV.duration && fxV.duration - fxV.currentTime < 0.35) fxV.style.opacity = "0";
  });
  /* Reframe pan + zoom, applied to the media inside its clipping box. The still
     branch cannot use transform — @keyframes still already owns it — so the zoom is
     handed over as --rfz and multiplied inside the keyframes instead. */
  function fxCrop(node, crop, isImg) {
    node.style.objectPosition = crop ? `${crop.x ?? 50}% ${crop.y ?? 50}%` : "";
    const z = crop?.z ? Math.max(1, Math.min(6, crop.z / 100)) : 1;
    if (isImg) node.style.setProperty("--rfz", z);
    else node.style.transform = z > 1 ? `scale(${z})` : "";
  }
  function playVideo(url, boxed, done, full, crop, onStart){
    const box = !!boxed && !full;
    fxVBox.classList.toggle("boxed", box);
    fxVBox.classList.toggle("full", !!full);
    fxV.classList.toggle("fit-contain", box);
    fxCrop(fxV, crop, false);
    fxV.muted = false;
    fxV.style.opacity = "1"; fxV.src = url; fxVBox.style.display = "block";
    /* A hung buffer fires stalled/waiting, never error — without this the queue's
       one-at-a-time gate would stay closed forever and every later FX would silently
       pile up behind it. */
    let settled = false;
    const finish = () => { if (settled) return; settled = true;
      clearTimeout(watchdog);
      fxVBox.style.display = "none"; fxV.removeAttribute("src"); fxV.style.opacity = "1"; done(); };
    const watchdog = setTimeout(() => {
      if (!fxV.currentTime) { console.warn("[acbz] clip never started, giving up:", url); finish(); }
    }, 8000);
    fxV.addEventListener("playing", () => { clearTimeout(watchdog); onStart && onStart(); }, { once: true });
    fxV.onended = fxV.onerror = finish;
    /* an unmuted clip can have play() refused outright; the graphic still matters more
       than its audio, so fall back to muted rather than showing nothing */
    fxV.play().catch(() => {
      fxV.muted = true;
      fxV.play().catch(() => finish());
    });
  }
  /* a one-shot still: 3s pop, then gone */
  function showStill(url, full, crop, done){
    fxIBox.classList.toggle("full", !!full);
    fxIBox.classList.toggle("boxed", !full);
    fxI.classList.toggle("fit-cover", !!full);
    fxCrop(fxI, crop, true);
    fxI.src = url; fxIBox.style.display = "block";
    fxI.classList.remove("go"); void fxI.offsetWidth; fxI.classList.add("go");
    setTimeout(() => { fxIBox.style.display = "none"; fxI.classList.remove("go"); done && done(); }, 3050);
  }
  function logoPop(team, bare, ms, done){   // logo core pop inside the ANIM box
    const t = C.TEAMS[team]; const b = $("#burst");
    b.classList.remove("fadeout");
    b.style.setProperty("--team", t?.color ?? "#35A7FF"); b.style.display = "block";
    b.innerHTML = `<div class="core${bare ? "" : ""}"><img src="${C.LOGO_URL(team)}"></div>`;
    setTimeout(() => b.classList.add("fadeout"), ms - 400);
    setTimeout(() => { b.style.display="none"; b.innerHTML=""; b.classList.remove("fadeout"); done && done(); }, ms);
  }
  function pump(){
    if (fxBusy || !fxQ.length) return; fxBusy = true;
    const job = fxQ.shift();
    const done = () => { fxBusy = false; pump(); };
    sfx(job.sfxUrl);
    const full = job.fit === "full";
    if (job.styleUrl && job.logoOverlay) {          // v2 style: one base + team logo on top
      if (job.styleImage) {
        showStill(job.styleUrl, full, job.styleCrop, null); job.onStart && job.onStart();
        logoPop(job.team, false, 2900, done);
      } else {
        playVideo(job.styleUrl, true, done, full, job.styleCrop, job.onStart);
        logoPop(job.team, false, 2900, null);
      }
    } else if (job.url && job.image) {              // one-shot AI still
      showStill(job.url, full, job.crop, done);
    } else if (job.url) {                           // video: boxed one-shot or full-canvas stinger
      playVideo(job.url, !!job.boxed, done, full, job.crop, job.onStart);
    } else if (job.team) {                          // CSS fallback burst
      const t = C.TEAMS[job.team]; const b = $("#burst");
      $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
      b.style.setProperty("--team", t.color); b.style.display = "block"; b.classList.remove("fadeout");
      let parts = "";
      for (let i=0;i<26;i++){
        const ang = Math.random()*Math.PI*2, dist = 320+Math.random()*560;
        parts += `<span class="p" style="--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;
                   animation-delay:${Math.random()*.15}s"></span>`;
      }
      b.innerHTML = `<div class="ring"></div><div class="ring" style="animation-delay:.15s"></div>
        <div class="core"><img src="${C.LOGO_URL(job.team)}"></div>${parts}`;
      setTimeout(() => b.classList.add("fadeout"), 2200);
      setTimeout(() => { b.style.display="none"; b.innerHTML=""; b.classList.remove("fadeout"); done(); }, 2600);
    } else done();
  }

  /* ---------------- FX cache warm ----------------
     Nothing used to preload FX media, and the overlay does not even learn a stinger's
     URL until the press event arrives — so the FIRST press of any clip was a cold fetch
     of a ~6 MB file, while the board dimmed on a fixed timer regardless. That is why a
     team could leave the board with the sound playing and no stinger, and why it only
     happened once per clip.

     Only the FX source needs these: each PC runs three browser sources, so warming
     without this gate would pull the set three times per PC. */
  const warmed = new Set();
  let warmQ = [], warmRunning = 0;
  const WARM_PARALLEL = 3;          // OBS is uploading a stream on this connection

  function warmOne(url) {
    return new Promise((done) => {
      const v = Object.assign(document.createElement("video"),
        { src: url, muted: true, playsInline: true, preload: "auto" });
      v.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
      const finish = () => { clearTimeout(t); v.removeAttribute("src"); v.remove(); done(); };
      const t = setTimeout(finish, 30000);
      v.addEventListener("canplaythrough", finish, { once: true });
      v.addEventListener("error", finish, { once: true });
      document.body.appendChild(v);
    });
  }
  function pumpWarm() {
    while (warmRunning < WARM_PARALLEL && warmQ.length) {
      const url = warmQ.shift();
      warmRunning++;
      warmOne(url).then(() => { warmRunning--; pumpWarm(); });
    }
  }
  function warmUrls(urls) {
    let added = 0;
    for (const u of urls) {
      if (!u || warmed.has(u)) continue;
      warmed.add(u); warmQ.push(u); added++;
    }
    if (added) { console.log(`[acbz] warming ${added} FX clip(s)`); pumpWarm(); }
  }

  /* Which clips this PC could need: every team's clip in the selected set, plus the
     clip each Stream Deck event key resolves to. Mirrors teamClipUrl/oneshotByPc in
     the deck function — the set-less set is Classic Stingers. */
  let warmKey = null;
  async function warmForState(s) {
    if (!(layer === "fx" || layer === "all")) return;
    if (!window.__sb) return;
    const setId = s?.animStyle?.meta?.set ?? null;
    const key = setId + "|" + JSON.stringify(s?.oneshots ?? {});
    if (key === warmKey) return; warmKey = key;
    try {
      let q = window.__sb.from("assets").select("id,url,meta")
        .eq("kind", "animation").not("url", "is", null);
      const { data } = await q;
      const rows = (data ?? []).filter(a => !a.meta?.deleted);
      const teamClips = [];
      for (const abbr of C.ORDER) {
        const forTeam = rows
          .filter(a => a.meta?.team === abbr && (a.meta?.set ?? null) === setId);
        if (forTeam[0]?.url) teamClips.push(forTeam[0].url);
      }
      const chosen = Object.values(s?.oneshots ?? {})
        .map(id => rows.find(a => a.id === id)?.url).filter(Boolean);
      const oneShots = rows.filter(a => a.meta?.group !== "team").map(a => a.url);
      warmUrls([...chosen, ...oneShots, ...teamClips]);
    } catch (e) { /* warming is best effort; a press still works cold */ }
  }

  /* ---------------- looping animation (Stream Deck toggle) ----------------
     Deliberately NOT routed through fxQ/pump(): fxBusy serialises one job at a
     time, so a never-ending job would starve every team stinger behind it. This
     gets its own lane in #layer-fx, under #flash/#fxVideo/#burst so a stinger
     still reads on top of it. It also can't reuse #fxVideo — that element has a
     permanent timeupdate handler that fades it out near the end of every pass. */
  const FXFADE = 0.35;                     // matches #fxVideo's own opacity transition
  let loopKey = null, loopBooted = false;
  function setLoopFx(fx) {
    if (!(layer === "fx" || layer === "all")) return;   // only the FX source draws it
    const key = fx?.url ? `${fx.url}|${!!fx.boxed}|${fx.fit ?? ""}` : null;
    if (key === loopKey) return;           // unrelated state change — leave it running
    const had = loopKey; loopKey = key;
    const root = $("#layer-fx");
    /* fade the outgoing loop, then drop it (same shape as #burst's fadeout) */
    root.querySelectorAll(".fxloop").forEach(w => {
      w.style.transition = `opacity ${FXFADE}s ease`; w.style.opacity = "0";
      setTimeout(() => { w._stop?.(); w.remove(); }, FXFADE * 1000);
    });
    if (!key) return;
    const full = fx.fit === "full", cover = full || !fx.boxed;
    let wrap;
    if (fx.image) {                        // a still just stays up until toggled off
      wrap = document.createElement("div");
      wrap.style.cssText = "position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:18";
      const im = Object.assign(document.createElement("img"), { src: fx.url });
      im.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:" +
        (cover ? "cover" : "contain");
      wrap.appendChild(im);
    } else {
      wrap = makeLoop(fx.url, fx, 18);     // two copies crossfaded at the seam; fx carries .crop
      wrap.querySelectorAll("video").forEach(v => { v.style.objectFit = cover ? "cover" : "contain"; });
    }
    wrap.classList.add("fxloop");
    /* mirror #fxVideo's three sizes exactly; inset:auto must precede left/top */
    if (full) wrap.style.cssText += ";inset:auto;left:0;top:645px;width:1080px;height:1275px";
    else if (fx.boxed) wrap.style.cssText += ";inset:auto;left:207px;top:800px;width:667px;height:413px";
    wrap.style.opacity = "0"; wrap.style.transition = `opacity ${FXFADE}s ease`;
    root.appendChild(wrap);
    requestAnimationFrame(() => { wrap.style.opacity = "1"; });
    /* the linked sound fires on a real press, never on a page reload */
    if (loopBooted && had !== key) sfx(fx.sfxUrl);
  }

  /* ---------------- state application ---------------- */
  /* board_action writes the state row and inserts the FX event in ONE transaction, and
     realtime delivers the row FIRST — so applyState always sees a fresh elimination before
     its stinger event arrives. It therefore holds the paint itself: any not-out -> out
     transition parks the team in pendingDim, and whichever comes next — the team_pick
     event's choreography, or this fallback — actually dims it. */
  const pendingDim = new Set();
  const dimTimers = new Map();      // team -> timer ids still owed a dimNow
  let boardBooted = false;          // the first paint is the current board, not a transition
  let lastState = null;
  function armDim(team, ms) {
    const t = setTimeout(() => dimNow(team), ms);
    dimTimers.set(team, (dimTimers.get(team) || []).concat(t));
  }
  function clearDim(team) {
    (dimTimers.get(team) || []).forEach(clearTimeout);
    dimTimers.delete(team); pendingDim.delete(team);
  }
  function dimNow(team) {
    const c = cells[team];
    if (!c || !pendingDim.has(team)) return;      // already dimmed, or restored meanwhile
    clearDim(team);
    c.classList.add("on", "slam"); c.classList.remove("hl");
    setTimeout(() => c.classList.remove("slam"), 600);
    triggerButtonAnim(team);
    recomputeHl();
  }
  /* highlighted set, with any mid-stinger team still counted as on the board */
  function hlKeyOf(s) {
    const picked = s?.board?.picked || {}, hl = s?.board?.highlighted || {};
    return C.ORDER.filter(a => hl[a] && !(picked[a] && !pendingDim.has(a))).join(",");
  }
  function recomputeHl() {
    const k = hlKeyOf(lastState);
    if (k === lastHlKey) return;
    lastHlKey = k; restartEffects();
  }
  function applyState(s) {
    if (!s) return;
    lastState = s;
    setBackground(s.background);
    setLoopFx(s.loopFx); loopBooted = true;
    warmForState(s);
    const partsChanged = applyBoardParts(s);
    const picked = s.board?.picked || {}, hl = s.board?.highlighted || {};
    for (const abbr of C.ORDER) {
      const want = !!picked[abbr];
      if (!want) clearDim(abbr);
      else if (boardBooted && !pendingDim.has(abbr) && !cells[abbr].classList.contains("on")) {
        pendingDim.add(abbr);                     // its stinger event is milliseconds behind
        armDim(abbr, 900);                        // …unless none ever comes
      }
      const out = want && !pendingDim.has(abbr);
      cells[abbr].classList.toggle("on", out);
      cells[abbr].classList.toggle("hl", !!hl[abbr] && !out);
    }
    boardBooted = true;
    /* Any change at all — intensity, grid, which effect, who is highlighted — restarts
       every effect together so the highlighted buttons stay in step. */
    const hlKey = hlKeyOf(s);
    const hlChanged = hlKey !== lastHlKey;
    lastHlKey = hlKey;
    if (partsChanged || hlChanged) restartEffects();
    rotator.setList(s.banners?.rotation || []);
  }
  const seen = new Set();
  function handleEvent(ev) {
    if (!ev || seen.has(ev.id)) return; seen.add(ev.id);
    if (ev.created_at && Date.now() - new Date(ev.created_at).getTime() > 20000) return;
    const p = ev.payload || {};
    if (p.pc && Number(p.pc) !== PC) return;        // v2: not for this PC
    switch (ev.type) {
      case "team_pick": {
        /* Dim the board 1200ms into the stinger, not 1200ms after the press. On a warm
           clip these are the same thing; on a slow one it stops the team disappearing
           before its animation exists. Capped so a clip that never starts still dims. */
        const media = !!(p.animUrl || p.styleUrl);
        clearDim(p.team);                         // take the fallback off applyState
        if (!cells[p.team]?.classList.contains("on")) pendingDim.add(p.team);
        runFx({ team: p.team, url: p.animUrl, sfxUrl: p.sfxUrl, fit: p.styleFit,
                styleUrl: p.styleUrl, styleImage: p.styleImage, logoOverlay: p.logoOverlay,
                styleCrop: p.styleCrop, crop: p.crop,
                onStart: media ? () => armDim(p.team, 1200) : null });
        armDim(p.team, media ? 2600 : 900);       // cap: a clip that never starts still dims
        break; }
      case "team_restore":
        clearDim(p.team); cells[p.team]?.classList.remove("on"); break;
      case "board_reset":
        C.ORDER.forEach(a => { clearDim(a); cells[a].classList.remove("on"); }); break;
      case "play_animation":
        runFx({ url: p.url, boxed: p.boxed, image: p.image, sfxUrl: p.sfxUrl, fit: p.fit,
                crop: p.crop }); break;
      case "play_sfx": sfx(p.url); break;
      case "banner_skip": rotator.next(); break;
    }
  }

  /* ---------------- transport: Supabase or same-browser preview ---------------- */
  if (C.SUPABASE_URL && C.SUPABASE_ANON_KEY) {
    const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    window.__sb = sb;
    sb.from("stream_state").select("data").eq("id", PC).single()
      .then(({data}) => applyState(data?.data));
    sb.channel("db")
      /* Filter server-side: unfiltered, all 15 sources (5 PCs x 3 layers) received every
         PC's state and threw away 14 of 15. `events` cannot be filtered the same way —
         it is (id, type, payload, created_at) with the pc inside the jsonb, and realtime
         filters only work on real columns — so that one still discards client-side. */
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"stream_state",
           filter:`id=eq.${PC}`}, (p)=>applyState(p.new.data))
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"events"},
          (p)=>handleEvent(p.new))
      .subscribe();
    sb.channel("presence:overlays",{config:{presence:{key:`pc-${PC}-${layer}`}}})
      .subscribe((st)=>{ if(st==="SUBSCRIBED")
        sb.channel("presence:overlays").track({pc:PC, layer, at:Date.now()}); });
  } else {
    try { applyState(JSON.parse(localStorage.getItem("acbz-state"))); } catch(e){}
    const bus = new BroadcastChannel("acbz-bus");
    bus.onmessage = (m) => {
      if (m.data.kind === "state") applyState(m.data.data);
      if (m.data.kind === "event") handleEvent(m.data.data);
    };
  }

  /* ---------------- self-update (no more "refresh cache" in OBS) ----------------
     OBS's browser source caches aggressively, so a deploy can sit unseen for hours.
     Poll our own files with cache:no-store; when the bytes change, reload. Nothing is
     lost on reload — all state lives in the cloud. */
  (function selfUpdate(){
    const FILES = ["index.html", "config.js"];
    const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++)
      h = (Math.imul(31, h) + s.charCodeAt(i)) | 0; return h; };
    let baseline = null;
    const read = async () => {
      const parts = [];
      for (const f of FILES) {
        const r = await fetch(`${f}?cb=${Date.now()}`, { cache: "no-store" });
        parts.push(hash(await r.text()));
      }
      return parts.join("|");
    };
    const tick = async () => {
      try {
        const now = await read();
        if (baseline === null) baseline = now;
        else if (now !== baseline) { console.log("[acbz] new build detected, reloading");
          location.reload(); }
      } catch (e) { /* offline: keep the current build running */ }
    };
    tick(); setInterval(tick, 45000);
  })();

  /* ---------------- debug guides ---------------- */
  if (new URLSearchParams(location.search).get("debug")) {
    const dbg = $("#debug"); dbg.style.display = "block";
    const mk = (r, c, l) => dbg.insertAdjacentHTML("beforeend",
      `<div style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-color:${c};color:${c}">${l}</div>`);
    mk(G.BG,"#f5c542","BG 1080x480"); mk(G.CAM1,"#ff4d4d","CAM1 667x413");
    mk(G.BOARD,"#8f6bff","BOARD 1080x165"); mk(G.BANNERS,"#a3e635","BANNERS 1080x97");
    mk(G.ANIM,"#22d3ee","ANIM 667x413"); mk(G.CAM2,"#f5c542","CAM2 1080x1275");
  }
})();
</script>
