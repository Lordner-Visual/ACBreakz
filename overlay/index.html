<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACBreakz Overlay</title>
<!--
  ACBreakz Cloud Overlay v2 — one URL, five independent PCs.
  OBS Browser Source: width 1080, height 1920, FPS 60.
  Layers (3 separate browser sources, same URL, different ?layer=):
    ?layer=bg   -> streamer background   ?layer=hud -> board + banners
    ?layer=fx   -> animations + sfx      ?layer=all -> testing in a browser
  ?pc=1..5 selects WHICH stream this is (each PC has its own board/banners/
  background/styles; the asset library is shared). &debug=1 draws guides.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --navy-deep:#071527; --navy:#0B1E33; --steel:#274A66;
    --teal-glass:#0D3540; --teal-dim:#082228;
    --copper:#B87333; --copper-dk:#7A4A1E; --gold:#D9A441;
    --bone:#EFE9DC; --volt:#35A7FF; --danger:#E5484D;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;
    font-family:"Arial Black","Segoe UI",system-ui,sans-serif}
  .abs{position:absolute}

  /* ---------- BG LAYER (streamer background, 1080x480) ---------- */
  #layer-bg{inset:0;display:none}
  #bgFrame{left:0;top:0;width:1080px;height:480px;overflow:hidden;background:
    radial-gradient(120% 160% at 50% -20%, #123a5c 0%, var(--navy) 45%, var(--navy-deep) 100%)}
  #bgFrame video,#bgFrame img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
  #bgFrame .fade{position:absolute;left:0;right:0;bottom:0;height:70px;
    background:linear-gradient(180deg,transparent,rgba(4,10,18,.85))}

  /* ---------- HUD LAYER (board 1080x165 @y480, banners 1080x97 @y645) ---------- */
  #layer-hud{inset:0;display:none}
  /* Tiles live inside the WhatNot-safe area measured from the original board art:
     x 111..968 (858 wide), tiles 53x53 square, 16 x 2. Never wider than this. */
  #board{--gap:0px;--tile:53px;--cols:16;--rows:2;
    --radius:calc(var(--tile) * .14);--bezel:calc(var(--tile) * .1);
    --logopad:calc(var(--tile) * .18);
    left:0;top:480px;width:1080px;height:165px;overflow:hidden;
    background:
      radial-gradient(140% 220% at 50% -60%, rgba(53,167,255,.18), transparent 55%),
      linear-gradient(180deg,#0E2A38 0%, #0A1F2C 55%, #081824 100%);
    background-size:cover;background-position:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -14px 26px rgba(0,0,0,.55);
    display:grid;
    grid-template-columns:repeat(var(--cols), var(--tile));
    grid-template-rows:repeat(var(--rows), var(--tile));
    justify-content:center;align-content:center;
    gap:var(--gap);padding:0 111px}
  /* one wide, feathered light bar sweeping BOTH rows at once (v2) */
  #board::after{content:"";position:absolute;top:-10px;bottom:-10px;left:0;width:430px;
    background:linear-gradient(100deg,
      transparent 0%, rgba(255,255,255,.015) 18%, rgba(255,255,255,.07) 38%,
      rgba(255,255,255,.13) 50%, rgba(255,255,255,.07) 62%, rgba(255,255,255,.015) 82%,
      transparent 100%);
    transform:skewX(-14deg);pointer-events:none;z-index:6;
    animation:sweep 9s cubic-bezier(.45,.05,.55,.95) infinite}
  @keyframes sweep{
    0%{left:-470px;opacity:0} 6%{opacity:1}
    58%{left:1120px;opacity:1} 62%{left:1120px;opacity:0} 100%{left:-470px;opacity:0}}
  /* Beveled copper bezel + dark inset line + teal glass, matching the original art.
     Two background layers: glass clipped to the padding box, bezel to the border box. */
  .cell{position:relative;border-radius:var(--radius);overflow:hidden;
    border:var(--bezel) solid transparent;
    background-image:
      radial-gradient(120% 110% at 50% 32%, #14505A 0%, #0B3238 48%, #061C21 100%),
      linear-gradient(145deg, #E8C07A 0%, #C08A45 17%, #8A5A26 52%, #6B3F17 76%, #B27A3E 100%);
    background-origin:padding-box, border-box;
    background-clip:padding-box, border-box;
    background-size:100% 100%, 100% 100%;background-repeat:no-repeat;
    box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.85), 0 2px 3px rgba(0,0,0,.55);
    transition:filter .45s ease}
  .cell::before{ /* faint glass gloss across the top edge */
    content:"";position:absolute;inset:0;
    background:linear-gradient(178deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 30%,transparent 52%);
    pointer-events:none;z-index:3}
  .cell img{position:absolute;inset:var(--logopad);
    width:calc(100% - 2*var(--logopad));height:calc(100% - 2*var(--logopad));
    object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));z-index:2;
    transition:filter .45s ease, opacity .45s ease}

  /* ---- v4: a custom button style REPLACES the stock bezel entirely ---- */
  #board.has-btnstyle{--logopad:calc(var(--tile) * .17)}
  #board.has-btnstyle .cell{border:none;box-shadow:none;background-color:transparent;
    background-size:100% 100%}
  #board.has-btnstyle .cell::before{display:none}

  /* ---- v4: grid styles (each still wears the chosen button style) ---- */
  #board.grid-checker{--radius:0px}
  #board.grid-checker{--bezel:calc(var(--tile) * .06)}
  #board.grid-checkerbare{--radius:0px}
  #board.grid-checkerbare .cell{border:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  #board.grid-honeycomb{--radius:0px;--logopad:calc(var(--tile) * .22)}
  #board.grid-honeycomb .cell{border:none;box-shadow:none;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
  /* interlock the rows by splitting the half-tile offset, so the combined span of both
     rows is exactly the safe width — neither row can run past the crop edge */
  #board.grid-honeycomb .cell:nth-child(-n+16){left:calc(var(--tile) * -.25)}
  #board.grid-honeycomb .cell:nth-child(n+17){left:calc(var(--tile) * .25)}
  #board.grid-honeycomb .cell::before{clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
  #board.grid-logos{--logopad:1px}
  #board.grid-logos .cell{border:none;box-shadow:none;background-image:none !important}
  #board.grid-logos .cell::before{display:none}
  /* the one deliberately non-square grid: wide buttons stretched across the safe area */
  #board.grid-rect84{grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);
    justify-content:stretch;align-content:stretch;padding:12px 111px;
    --logopad:4px;--radius:6px;--bezel:3px}
  #board.grid-slant{--radius:0px}
  #board.grid-slant .cell{border:none;
    clip-path:polygon(16% 0%,100% 0%,84% 100%,0% 100%)}
  #board.grid-slant .cell::before{clip-path:polygon(16% 0%,100% 0%,84% 100%,0% 100%)}
  /* v2: eliminate-only — picked teams simply dim (no X, no color change) */
  .cell.on{filter:brightness(.38) saturate(.55)}
  .cell.on img{opacity:.55}
  .cell.slam{animation:slam .5s ease-out}
  @keyframes slam{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-2deg)}55%{transform:scale(.95) rotate(1deg)}100%{transform:scale(1)}}

  /* ---------- v3 button animations ---------- */
  .cell .vfx{position:absolute;inset:-14%;width:128%;height:128%;object-fit:cover;
    z-index:5;pointer-events:none;mix-blend-mode:screen;opacity:0;
    transition:opacity .28s linear}
  .cell.fx-video .vfx{opacity:1}
  /* AMBIENT: every button animates on the same clock, so the board pulses together */
  #board.anim-glow .cell::after{content:"";position:absolute;inset:0;border-radius:8px;
    z-index:4;pointer-events:none;box-shadow:inset 0 0 0 2px var(--gold), 0 0 14px 2px var(--gold);
    animation:bglow 2.6s ease-in-out infinite}
  @keyframes bglow{0%,100%{opacity:.12}50%{opacity:.85}}
  #board.anim-fire .cell::after{content:"";position:absolute;inset:-2px;border-radius:10px;
    z-index:4;pointer-events:none;
    background:linear-gradient(0deg,rgba(255,140,20,.85),rgba(255,60,0,.25) 45%,transparent 70%);
    filter:blur(3px);animation:bfire 1.5s ease-in-out infinite alternate}
  @keyframes bfire{0%{opacity:.35;transform:translateY(2px) scaleY(.96)}
    100%{opacity:.9;transform:translateY(-2px) scaleY(1.04)}}
  #board.anim-lightning .cell::after{content:"";position:absolute;inset:-1px;border-radius:10px;
    z-index:4;pointer-events:none;border:2px solid var(--volt);
    box-shadow:0 0 12px var(--volt),inset 0 0 8px var(--volt);opacity:0;
    animation:blight 3.4s linear infinite}
  @keyframes blight{0%,86%{opacity:0}88%{opacity:1}90%{opacity:.15}92%{opacity:1}96%{opacity:0}}
  #board.anim-glitch .cell{animation:bglitch 3.2s steps(1,end) infinite}
  @keyframes bglitch{0%,90%{transform:none;filter:none}
    91%{transform:translateX(-3px);filter:hue-rotate(80deg) saturate(2)}
    93%{transform:translateX(3px);filter:hue-rotate(-60deg)}
    95%{transform:translateX(-1px)}97%{transform:none;filter:none}}
  /* v4: once any team is highlighted, ambient effects play ONLY on those teams */
  #board.hl-mode .cell:not(.hl)::after{display:none !important}
  #board.hl-mode.anim-glitch .cell:not(.hl){animation:none}
  /* TRIGGER: fires on the team that was just hit */
  .cell.fx-pop{animation:bpop .85s cubic-bezier(.22,1.4,.3,1);z-index:7}
  @keyframes bpop{0%{transform:scale(1)}35%{transform:scale(1.55);filter:brightness(1.6)}
    60%{transform:scale(1.42)}82%{transform:scale(.9)}100%{transform:scale(1)}}
  .cell .dust{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;
    background:rgba(255,240,210,.9);box-shadow:0 0 6px rgba(255,220,160,.9);z-index:8;
    animation:dust .8s ease-out forwards}
  @keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

  #banners{left:0;top:645px;width:1080px;height:97px;overflow:hidden;background:#06111b}
  #banners .b{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
  #banners .b.live{opacity:1}
  #banners .b img,#banners .b video{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
  #banners .b .txt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--bone);font-size:44px;letter-spacing:1px;text-transform:uppercase;
    text-shadow:0 3px 0 #000,0 0 18px rgba(53,167,255,.6);padding:0 40px;text-align:center;
    background:linear-gradient(90deg,var(--navy-deep),var(--steel),var(--navy-deep))}

  /* ---------- FX LAYER (full canvas; focus box 667x413 @207,800) ---------- */
  #layer-fx{inset:0;display:none;pointer-events:none}
  #fxVideo{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;
    display:none;z-index:20;opacity:1;transition:opacity .35s ease}
  /* v2: one-shot animations play INSIDE the ANIM focus box, per the layout key */
  #fxVideo.boxed{inset:auto;left:207px;top:800px;width:667px;height:413px;object-fit:contain}
  #fxImg{position:absolute;left:207px;top:800px;width:667px;height:413px;display:none;
    z-index:20;object-fit:contain;opacity:0}
  #fxImg.go{animation:still 3s ease-out forwards}
  @keyframes still{0%{opacity:0;transform:scale(.82)}12%{opacity:1}
    85%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.04)}}
  #burst{position:absolute;left:207px;top:800px;width:667px;height:413px;display:none;z-index:21}
  #burst .ring{position:absolute;left:50%;top:50%;width:80px;height:80px;border-radius:50%;
    border:6px solid var(--volt);transform:translate(-50%,-50%);
    animation:ring 1.5s cubic-bezier(.1,.8,.2,1) forwards;box-shadow:0 0 30px var(--volt)}
  @keyframes ring{to{width:1400px;height:1400px;opacity:0;border-width:1px}}
  #burst .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);
    width:300px;height:300px;border-radius:36px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.25), rgba(7,21,39,.92) 70%);
    border:4px solid var(--gold);box-shadow:0 0 60px 10px var(--team,#35A7FF),inset 0 0 40px rgba(0,0,0,.6);
    /* gentle overshoot: even mid-pop the tilted core's bounds stay inside ANIM 667x413 */
    animation:core 2.4s cubic-bezier(.2,1.2,.3,1) forwards}
  #burst .core img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.8))}
  #burst .core.bare{background:transparent;border:none;box-shadow:none}
  @keyframes core{0%{transform:translate(-50%,-50%) scale(0) rotate(-14deg)}
    55%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}
    75%{transform:translate(-50%,-50%) scale(1)}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  #burst.fadeout .core{animation:coreout .4s ease-in forwards}
  @keyframes coreout{to{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
  #burst .p{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:3px;
    background:var(--team,#35A7FF);box-shadow:0 0 10px var(--team,#35A7FF);
    animation:p 1.6s ease-out forwards}
  @keyframes p{to{transform:translate(var(--dx),var(--dy)) rotate(560deg) scale(.2);opacity:0}}
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.85),transparent 60%);
    opacity:0;z-index:19}
  #flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

  /* ---------- debug guides ---------- */
  #debug{inset:0;display:none;pointer-events:none;z-index:99}
  #debug div{position:absolute;border:2px dashed;font:700 18px monospace;color:#fff;padding:4px}
</style>
</head>
<body>

<div id="layer-bg" class="abs">
  <div id="bgFrame" class="abs"><div class="fade"></div></div>
</div>

<div id="layer-hud" class="abs">
  <div id="board" class="abs"></div>
  <div id="banners" class="abs"></div>
</div>

<div id="layer-fx" class="abs">
  <div id="flash"></div>
  <video id="fxVideo" playsinline></video>
  <img id="fxImg" alt="">
  <div id="burst"></div>
</div>

<div id="debug" class="abs"></div>

<script>
(() => {
  const C = window.ACBZ, G = C.GEOM;
  const $ = (s) => document.querySelector(s);
  const layer = C.LAYER, PC = C.DEVICE;
  const show = (id) => { $(id).style.display = "block"; };
  if (layer === "bg"  || layer === "all") show("#layer-bg");
  if (layer === "hud" || layer === "all") show("#layer-hud");
  if (layer === "fx"  || layer === "all") show("#layer-fx");

  /* ---------------- board cells (v2: all logos always visible) ---------------- */
  const boardEl = $("#board");
  const cells = {};
  C.ORDER.forEach((abbr) => {
    const t = C.TEAMS[abbr];
    const d = document.createElement("div");
    d.className = "cell";
    d.innerHTML = `<img src="${C.LOGO_URL(abbr)}" alt="${t.name}">`;
    boardEl.appendChild(d); cells[abbr] = d;
  });

  /* ------- board style parts: buttons / background / button animation (v3) ------- */
  const AMBIENT = ["glow","fire","lightning","glitch"];
  const GRIDS = ["buttons","checker","checkerbare","honeycomb","logos","rect84","slant"];
  /* WhatNot-safe tile area, measured from the original board art:
     x 111..968 (858 wide) inside the 1080x165 band; original tiles are 53x53. */
  const SAFE_W = 858, SAFE_H = 141, MAX_TILE = 53;
  const GRID_CFG = {
    buttons:{cols:16,rows:2}, checker:{cols:16,rows:2}, checkerbare:{cols:16,rows:2},
    honeycomb:{cols:16,rows:2,slack:0.5},           // row 2 is offset half a tile
    logos:{cols:16,rows:2}, slant:{cols:16,rows:2},
    rect84:{cols:8,rows:4,stretch:true},            // deliberately rectangular
  };
  /* biggest SQUARE tile that keeps every button inside the safe area at this spacing */
  function tileFor(grid, gap) {
    const c = GRID_CFG[grid] ?? GRID_CFG.buttons;
    const byWidth  = (SAFE_W - (c.cols - 1) * gap) / (c.cols + (c.slack ?? 0));
    const byHeight = (SAFE_H - (c.rows - 1) * gap) / c.rows;
    return Math.max(12, Math.floor(Math.min(MAX_TILE, byWidth, byHeight)));
  }
  let partsKey = null, btnAnim = null;
  function applyBoardParts(s) {
    const btn = s?.boardButtons, bg = s?.boardBg, anim = s?.buttonAnim;
    const grid = GRIDS.includes(s?.boardGrid) ? s.boardGrid : "buttons";
    const gap = Math.max(0, Math.min(20, Number(s?.boardGap ?? 0)));
    const key = [btn?.url, bg?.url, anim?.id, anim?.meta?.effect, anim?.url, grid, gap].join("|");
    if (key === partsKey) return; partsKey = key;

    /* grid shape + spacing (buttons touch at gap 0, and are square unless it's 8x4) */
    GRIDS.forEach(g => boardEl.classList.remove("grid-" + g));
    boardEl.classList.add("grid-" + grid);
    const cfg = GRID_CFG[grid] ?? GRID_CFG.buttons;
    boardEl.style.setProperty("--gap", gap + "px");
    boardEl.style.setProperty("--cols", cfg.cols);
    boardEl.style.setProperty("--rows", cfg.rows);
    boardEl.style.setProperty("--tile", cfg.stretch ? "auto" : tileFor(grid, gap) + "px");
    boardEl.classList.toggle("has-btnstyle", !!btn?.url);

    /* background: still image or looping video behind the grid */
    clearLoopers(boardEl);
    boardEl.querySelectorAll("video.boardbg").forEach(n => n.remove());
    if (bg?.url && /\.(webm|mp4)(\?|$)/i.test(bg.url)) {
      boardEl.style.backgroundImage = "";
      boardEl.insertBefore(makeLoop(bg.url, bg.meta ?? bg, 0), boardEl.firstChild);
    } else {
      boardEl.style.backgroundImage = bg?.url ? `url("${bg.url}")` : "";
    }

    /* buttons: texture on every cell */
    for (const abbr of C.ORDER)
      cells[abbr].style.backgroundImage = btn?.url ? `url("${btn.url}")` : "";

    /* button animation: ambient classes apply to all cells on one shared clock */
    AMBIENT.forEach(e => boardEl.classList.remove("anim-" + e));
    btnAnim = anim ?? null;
    const eff = anim?.meta?.effect;
    if (eff && AMBIENT.includes(eff) && anim?.meta?.mode !== "trigger")
      boardEl.classList.add("anim-" + eff);
  }
  /* trigger-mode effects fire on the single cell that was just hit
     (suppressed when highlight mode is on and this team isn't highlighted) */
  function triggerButtonAnim(abbr) {
    const cell = cells[abbr]; if (!cell || !btnAnim) return;
    if (boardEl.classList.contains("hl-mode") && !cell.classList.contains("hl")) return;
    const m = btnAnim.meta ?? {};
    if (m.effect === "none") return;
    if (btnAnim.url && /\.(webm|mp4)(\?|$)/i.test(btnAnim.url)) {   // AI-generated clip
      cell.querySelectorAll("video.vfx").forEach(n => n.remove());
      const v = Object.assign(document.createElement("video"),
        {src:btnAnim.url, autoplay:true, muted:true, playsInline:true, className:"vfx"});
      cell.appendChild(v); cell.classList.add("fx-video");
      const stop = () => { cell.classList.remove("fx-video");        // fade out, then drop
        setTimeout(() => v.remove(), 320); };
      v.onended = v.onerror = stop; setTimeout(stop, 4000);
      return;
    }
    if (m.mode === "trigger" || m.effect === "pop") {
      cell.classList.remove("fx-pop"); void cell.offsetWidth; cell.classList.add("fx-pop");
      for (let i = 0; i < 10; i++) {                                 // dust puff on the slam
        const d = document.createElement("span"); d.className = "dust";
        const a = Math.random()*Math.PI*2, r = 26 + Math.random()*34;
        d.style.setProperty("--dx", `${Math.cos(a)*r}px`);
        d.style.setProperty("--dy", `${Math.sin(a)*r}px`);
        d.style.animationDelay = `${0.34 + Math.random()*0.12}s`;
        cell.appendChild(d); setTimeout(() => d.remove(), 1400);
      }
      setTimeout(() => cell.classList.remove("fx-pop"), 900);
    }
  }

  /* ---------------- banner rotator ---------------- */
  const banEl = $("#banners");
  /* reframe: pan (x/y %) + zoom (z %, 100 = fit) — used by banners and backgrounds */
  const cropCss = (m) => {
    const c = m?.crop; if (!c) return "";
    const z = Math.max(1, Math.min(4, (c.z ?? 100) / 100));
    return `object-position:${c.x ?? 50}% ${c.y ?? 50}%;transform:scale(${z});`;
  };
  const applyCrop = (node, m) => {
    const c = m?.crop; if (!node) return;
    node.style.objectPosition = c ? `${c.x ?? 50}% ${c.y ?? 50}%` : "";
    node.style.transform = c?.z ? `scale(${Math.max(1, Math.min(4, c.z / 100))})` : "";
  };

  /* Seamless looper: AI clips rarely loop cleanly, so run two copies of the file and
     crossfade at the seam — the jump is never visible. Returns a positioned wrapper. */
  const XFADE = 0.55;
  function makeLoop(url, cropMeta, z) {
    const wrap = document.createElement("div");
    wrap.className = "looper";
    wrap.style.cssText = `position:absolute;inset:0;overflow:hidden;z-index:${z ?? 0};pointer-events:none`;
    const mk = () => {
      const v = Object.assign(document.createElement("video"),
        { src: url, muted: true, playsInline: true, preload: "auto" });
      v.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" +
        `transition:opacity ${XFADE}s linear;opacity:0`;
      applyCrop(v, cropMeta);
      wrap.appendChild(v); return v;
    };
    let cur = mk(), nxt = mk();
    cur.style.opacity = "1";
    cur.addEventListener("loadedmetadata", () => cur.play().catch(()=>{}), { once: true });
    const tick = () => {
      const d = cur.duration;
      if (d && cur.currentTime >= d - XFADE && nxt.paused) {
        nxt.currentTime = 0; nxt.play().catch(()=>{});
        nxt.style.opacity = "1"; cur.style.opacity = "0";
        const finished = cur;
        setTimeout(() => { finished.pause(); finished.currentTime = 0; }, XFADE * 1000);
        [cur, nxt] = [nxt, cur];
      }
      wrap._raf = requestAnimationFrame(tick);
    };
    wrap._raf = requestAnimationFrame(tick);
    wrap._stop = () => cancelAnimationFrame(wrap._raf);
    return wrap;
  }
  const clearLoopers = (root) => root.querySelectorAll(".looper")
    .forEach(n => { n._stop?.(); n.remove(); });
  const rotator = {
    list: [], i: -1, timer: null,
    setList(list) {
      const same = JSON.stringify((list||[]).map(a=>[a.id,a.meta?.crop])) ===
                   JSON.stringify(this.list.map(a=>[a.id,a.meta?.crop]));
      this.list = list || [];
      if (!same) { this.i = -1; this.next(); }
      if (!this.list.length) { clearTimeout(this.timer); banEl.innerHTML=""; }
    },
    next() {
      clearTimeout(this.timer);
      if (!this.list.length) return;
      this.i = (this.i + 1) % this.list.length;
      const a = this.list[this.i];
      const b = document.createElement("div"); b.className = "b";
      if (a.meta?.type === "text" && !a.url) {
        b.innerHTML = `<div class="txt">${(a.meta.text||"").replace(/</g,"&lt;")}</div>`;
      } else if (/\.(webm|mp4)(\?|$)/i.test(a.url||"")) {
        b.innerHTML = `<video src="${a.url}" autoplay muted loop playsinline style="${cropCss(a.meta)}"></video>`;
      } else {
        b.innerHTML = `<img src="${a.url}" style="${cropCss(a.meta)}">`;
      }
      banEl.appendChild(b);
      requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add("live")));
      while (banEl.children.length > 2) banEl.firstChild.remove();
      [...banEl.children].slice(0,-1).forEach(n => n.classList.remove("live"));
      this.timer = setTimeout(() => this.next(), C.bannerSeconds(a) * 1000);
    },
  };

  /* ---------------- background (with reframe crop) ---------------- */
  let bgKey = null;
  function setBackground(bg) {
    const key = bg?.url ? bg.url + JSON.stringify(bg.crop ?? null) : null;
    if (key === bgKey) return; bgKey = key;
    const f = $("#bgFrame");
    clearLoopers(f);
    f.querySelectorAll("video,img").forEach(n => n.remove());
    if (!bg?.url) return;
    if (/\.(webm|mp4)(\?|$)/i.test(bg.url)) {          // seamless crossfade loop
      f.insertBefore(makeLoop(bg.url, bg), f.firstChild);
      return;
    }
    const n = Object.assign(document.createElement("img"), {src:bg.url});
    applyCrop(n, bg);
    f.insertBefore(n, f.firstChild);
  }

  /* ---------------- FX ---------------- */
  const fxQ = []; let fxBusy = false;
  function sfx(url, vol=1){ if(!url) return; try{ const a=new Audio(url); a.volume=vol; a.play(); }catch(e){} }
  function runFx(job){ fxQ.push(job); pump(); }
  const fxV = $("#fxVideo");
  fxV.addEventListener("timeupdate", () => {   // safety fade even if the file lacks one
    if (fxV.duration && fxV.duration - fxV.currentTime < 0.35) fxV.style.opacity = "0";
  });
  function playVideo(url, boxed, done){
    fxV.classList.toggle("boxed", !!boxed);
    fxV.style.opacity = "1"; fxV.src = url; fxV.style.display = "block";
    fxV.onended = fxV.onerror = () => {
      fxV.style.display = "none"; fxV.removeAttribute("src"); fxV.style.opacity = "1"; done();
    };
    fxV.play().catch(() => { fxV.style.display = "none"; done(); });
  }
  function logoPop(team, bare, ms, done){   // logo core pop inside the ANIM box
    const t = C.TEAMS[team]; const b = $("#burst");
    b.classList.remove("fadeout");
    b.style.setProperty("--team", t?.color ?? "#35A7FF"); b.style.display = "block";
    b.innerHTML = `<div class="core${bare ? "" : ""}"><img src="${C.LOGO_URL(team)}"></div>`;
    setTimeout(() => b.classList.add("fadeout"), ms - 400);
    setTimeout(() => { b.style.display="none"; b.innerHTML=""; b.classList.remove("fadeout"); done && done(); }, ms);
  }
  function pump(){
    if (fxBusy || !fxQ.length) return; fxBusy = true;
    const job = fxQ.shift();
    const done = () => { fxBusy = false; pump(); };
    sfx(job.sfxUrl);
    if (job.styleUrl && job.logoOverlay) {          // v2 style: one base + team logo on top
      if (job.styleImage) {
        const im = $("#fxImg"); im.src = job.styleUrl; im.style.display = "block";
        im.classList.remove("go"); void im.offsetWidth; im.classList.add("go");
        setTimeout(() => { im.style.display = "none"; im.classList.remove("go"); }, 3050);
        logoPop(job.team, false, 2900, done);
      } else {
        playVideo(job.styleUrl, true, done);
        logoPop(job.team, false, 2900, null);
      }
    } else if (job.url && job.image) {              // one-shot AI still in the box
      const im = $("#fxImg"); im.src = job.url; im.style.display = "block";
      im.classList.remove("go"); void im.offsetWidth; im.classList.add("go");
      setTimeout(() => { im.style.display = "none"; im.classList.remove("go"); done(); }, 3050);
    } else if (job.url) {                           // video: boxed one-shot or full-canvas stinger
      playVideo(job.url, !!job.boxed, done);
    } else if (job.team) {                          // CSS fallback burst
      const t = C.TEAMS[job.team]; const b = $("#burst");
      $("#flash").classList.remove("go"); void $("#flash").offsetWidth; $("#flash").classList.add("go");
      b.style.setProperty("--team", t.color); b.style.display = "block"; b.classList.remove("fadeout");
      let parts = "";
      for (let i=0;i<26;i++){
        const ang = Math.random()*Math.PI*2, dist = 320+Math.random()*560;
        parts += `<span class="p" style="--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;
                   animation-delay:${Math.random()*.15}s"></span>`;
      }
      b.innerHTML = `<div class="ring"></div><div class="ring" style="animation-delay:.15s"></div>
        <div class="core"><img src="${C.LOGO_URL(job.team)}"></div>${parts}`;
      setTimeout(() => b.classList.add("fadeout"), 2200);
      setTimeout(() => { b.style.display="none"; b.innerHTML=""; b.classList.remove("fadeout"); done(); }, 2600);
    } else done();
  }

  /* ---------------- state application ---------------- */
  function applyState(s) {
    if (!s) return;
    setBackground(s.background);
    applyBoardParts(s);
    const picked = s.board?.picked || {}, hl = s.board?.highlighted || {};
    for (const abbr of C.ORDER) {
      cells[abbr].classList.toggle("on", !!picked[abbr]);
      cells[abbr].classList.toggle("hl", !!hl[abbr] && !picked[abbr]);
    }
    boardEl.classList.toggle("hl-mode",
      C.ORDER.some(a => hl[a] && !picked[a]));
    rotator.setList(s.banners?.rotation || []);
  }
  const seen = new Set();
  function handleEvent(ev) {
    if (!ev || seen.has(ev.id)) return; seen.add(ev.id);
    if (ev.created_at && Date.now() - new Date(ev.created_at).getTime() > 20000) return;
    const p = ev.payload || {};
    if (p.pc && Number(p.pc) !== PC) return;        // v2: not for this PC
    switch (ev.type) {
      case "team_pick":
        runFx({ team: p.team, url: p.animUrl, sfxUrl: p.sfxUrl,
                styleUrl: p.styleUrl, styleImage: p.styleImage, logoOverlay: p.logoOverlay });
        setTimeout(() => { cells[p.team]?.classList.add("on","slam");
          triggerButtonAnim(p.team);
          setTimeout(()=>cells[p.team]?.classList.remove("slam"), 600); },
          (p.animUrl || p.styleUrl) ? 1200 : 900);
        break;
      case "team_restore": cells[p.team]?.classList.remove("on"); break;
      case "board_reset": C.ORDER.forEach(a => cells[a].classList.remove("on")); break;
      case "play_animation": runFx({ url: p.url, boxed: p.boxed, image: p.image, sfxUrl: p.sfxUrl }); break;
      case "play_sfx": sfx(p.url); break;
      case "banner_skip": rotator.next(); break;
    }
  }

  /* ---------------- transport: Supabase or same-browser preview ---------------- */
  if (C.SUPABASE_URL && C.SUPABASE_ANON_KEY) {
    const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
    sb.from("stream_state").select("data").eq("id", PC).single()
      .then(({data}) => applyState(data?.data));
    sb.channel("db")
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"stream_state"},
          (p)=>{ if (p.new.id === PC) applyState(p.new.data); })
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"events"},
          (p)=>handleEvent(p.new))
      .subscribe();
    sb.channel("presence:overlays",{config:{presence:{key:`pc-${PC}-${layer}`}}})
      .subscribe((st)=>{ if(st==="SUBSCRIBED")
        sb.channel("presence:overlays").track({pc:PC, layer, at:Date.now()}); });
  } else {
    try { applyState(JSON.parse(localStorage.getItem("acbz-state"))); } catch(e){}
    const bus = new BroadcastChannel("acbz-bus");
    bus.onmessage = (m) => {
      if (m.data.kind === "state") applyState(m.data.data);
      if (m.data.kind === "event") handleEvent(m.data.data);
    };
  }

  /* ---------------- debug guides ---------------- */
  if (new URLSearchParams(location.search).get("debug")) {
    const dbg = $("#debug"); dbg.style.display = "block";
    const mk = (r, c, l) => dbg.insertAdjacentHTML("beforeend",
      `<div style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-color:${c};color:${c}">${l}</div>`);
    mk(G.BG,"#f5c542","BG 1080x480"); mk(G.CAM1,"#ff4d4d","CAM1 667x413");
    mk(G.BOARD,"#8f6bff","BOARD 1080x165"); mk(G.BANNERS,"#a3e635","BANNERS 1080x97");
    mk(G.ANIM,"#22d3ee","ANIM 667x413"); mk(G.CAM2,"#f5c542","CAM2 1080x1275");
  }
})();
</script>
</body>
